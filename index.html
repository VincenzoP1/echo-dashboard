   GENERALE

* {

html,

<script>

/* =====================================
   CONFIG
   ===================================== */

const LAT =
  38.27;

const LON =
  16.30;

const RANGE_KM =
  200;

const ADSB_NM =
  110;



/* =====================================
   CLOCK
   ===================================== */

function updateClock(){

  const d =
    new Date();


  document
  .getElementById(
    "clock"
  )
  .textContent =

    d.toLocaleTimeString(
      "it-IT",
      {
        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

}


updateClock();


setInterval(
  updateClock,
  1000
);



/* =====================================
   START
   ===================================== */

function startDashboard(){

  const el =
    document
    .documentElement;


  try{

    if(
      el.requestFullscreen
    ){

      el
      .requestFullscreen();

    }

    else if(
      el.webkitRequestFullscreen
    ){

      el
      .webkitRequestFullscreen();

    }

  }

  catch(e){}


  document
  .getElementById(
    "startup"
  )
  .style
  .display =
    "none";


  resizeCanvases();


  initWeatherMap();

  loadAircraft();

  loadWeather();

  loadRainViewer();

  drawSky();

}



/* =====================================
   NAVIGATION
   ===================================== */

function showPage(
  id,
  button
){

  document
  .querySelectorAll(
    ".page"
  )
  .forEach(
    p =>
    p.classList
    .remove("active")
  );


  document
  .getElementById(id)
  .classList
  .add("active");


  document
  .querySelectorAll(
    "#nav button"
  )
  .forEach(
    b =>
    b.classList
    .remove("active")
  );


  button
  .classList
  .add("active");


  setTimeout(
    function(){

      if(
        id ===
        "weatherPage"
        &&
        weatherMap
      ){

        weatherMap
        .invalidateSize();

      }


      if(
        id ===
        "skyPage"
      ){

        resizeCanvases();

        drawSky();

      }

    },
    100
  );

}



/* =====================================
   EXTERNAL MAPS
   ===================================== */

function openAdsb(){

  window.open(

    "https://globe.adsb.fi/?SiteLat=38.27&SiteLon=16.30&centerReceiver&zoom=7&hideSideBar",

    "_blank"

  );

}


function openISS(){

  window.open(

    "https://www.n2yo.com/?s=25544",

    "_blank"

  );

}



/* =====================================
   RADAR CANVAS
   ===================================== */

const radarCanvas =

  document
  .getElementById(
    "radarCanvas"
  );


const ctx =

  radarCanvas
  .getContext(
    "2d"
  );


let aircraft = [];

let sweep = 0;



function resizeCanvases(){

  radarCanvas.width =
    radarCanvas
    .clientWidth;

  radarCanvas.height =
    radarCanvas
    .clientHeight;


  skyCanvas.width =
    skyCanvas
    .clientWidth;

  skyCanvas.height =
    skyCanvas
    .clientHeight;

}


window
.addEventListener(
  "resize",
  resizeCanvases
);



/* =====================================
   POSITION CALCULATION
   ===================================== */

function positionFromLatLon(
  lat,
  lon
){

  const R =
    6371;


  const p1 =
    LAT *
    Math.PI /
    180;


  const p2 =
    lat *
    Math.PI /
    180;


  const dp =

    (lat-LAT) *
    Math.PI /
    180;


  const dl =

    (lon-LON) *
    Math.PI /
    180;


  const a =

    Math.sin(dp/2) ** 2

    +

    Math.cos(p1) *
    Math.cos(p2) *

    Math.sin(dl/2) ** 2;


  const distance =

    2 *
    R *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1-a)

    );


  const y =

    Math.sin(dl) *
    Math.cos(p2);


  const x =

    Math.cos(p1) *
    Math.sin(p2)

    -

    Math.sin(p1) *
    Math.cos(p2) *
    Math.cos(dl);


  const bearing =

    (
      Math.atan2(y,x) *
      180 /
      Math.PI
      +
      360
    )
    %
    360;


  return {

    distance:
      distance,

    bearing:
      bearing

  };

}



/* =====================================
   ADS-B
   ===================================== */

async function loadAircraft(){

  const status =

    document
    .getElementById(
      "radarStatus"
    );


  status.textContent =
    "CONNECTING ADS-B...";


  /* ADS-B.fi */

  try{


    const urlFi =

      "https://opendata.adsb.fi/api/v3/lat/" +
      LAT +
      "/lon/" +
      LON +
      "/dist/" +
      ADSB_NM;


    const response =

      await fetch(
        urlFi
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =

      await response
      .json();


    aircraft =

      data.ac ||
      [];


    status.textContent =

      "ADS-B.FI • " +
      aircraft.length +
      " TARGETS • 200 KM";


    return;

  }

  catch(error){

    console.log(
      "ADS-B.fi failed"
    );

  }



  /* ADSB.LOL FALLBACK */

  try{


    status.textContent =

      "TRYING ADSB.LOL...";


    const urlLol =

      "https://api.adsb.lol/v2/lat/" +
      LAT +
      "/lon/" +
      LON +
      "/dist/" +
      ADSB_NM;


    const response =

      await fetch(
        urlLol
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =

      await response
      .json();


    aircraft =

      data.ac ||
      [];


    status.textContent =

      "ADSB.LOL • " +
      aircraft.length +
      " TARGETS • 200 KM";


    return;

  }

  catch(error){


    aircraft = [];


    status.textContent =

      "ADS-B OFFLINE • " +
      error.message;

  }

}


setInterval(
  loadAircraft,
  5000
);



/* =====================================
   DRAW RADAR
   ===================================== */

function drawRadar(){

  const w =
    radarCanvas.width;

  const h =
    radarCanvas.height;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  const cx =
    w/2;

  const cy =
    h/2;


  const radius =

    Math.min(
      w,
      h
    ) *
    .46;



  /* RINGS */

  ctx.strokeStyle =

    "rgba(100,255,140,.24)";


  ctx.lineWidth =
    1;


  for(
    let i=1;
    i<=4;
    i++
  ){

    ctx.beginPath();

    ctx.arc(

      cx,
      cy,

      radius *
      i /
      4,

      0,

      Math.PI *
      2

    );

    ctx.stroke();

  }



  /* CROSS */

  ctx.beginPath();

  ctx.moveTo(
    cx-radius,
    cy
  );

  ctx.lineTo(
    cx+radius,
    cy
  );

  ctx.moveTo(
    cx,
    cy-radius
  );

  ctx.lineTo(
    cx,
    cy+radius
  );

  ctx.stroke();



  /* CARDINALS */

  ctx.fillStyle =
    "#79ff9b";


  ctx.font =
    "10px monospace";


  ctx.fillText(
    "N",
    cx-3,
    cy-radius+11
  );


  ctx.fillText(
    "S",
    cx-3,
    cy+radius-4
  );


  ctx.fillText(
    "W",
    cx-radius+5,
    cy-4
  );


  ctx.fillText(
    "E",
    cx+radius-11,
    cy-4
  );



  /* RANGE LABELS */

  ctx.font =
    "8px monospace";


  [50,100,150,200]
  .forEach(

    function(
      km,
      index
    ){

      ctx.fillText(

        km +
        (
          km === 200
          ?
          "KM"
          :
          ""
        ),

        cx +
        radius *
        (index+1) /
        4 +
        2,

        cy-2

      );

    }

  );



  /* SWEEP */

  const angle =

    sweep *
    Math.PI /
    180;


  ctx.strokeStyle =

    "rgba(110,255,140,.7)";


  ctx.lineWidth =
    2;


  ctx.beginPath();

  ctx.moveTo(
    cx,
    cy
  );


  ctx.lineTo(

    cx +
    Math.sin(angle) *
    radius,

    cy -
    Math.cos(angle) *
    radius

  );


  ctx.stroke();



  /* SIDERO */

  ctx.fillStyle =
    "#ffffff";


  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.font =
    "8px monospace";


  ctx.fillText(
    "SIDERNO",
    cx+5,
    cy-5
  );



  /* AIRCRAFT */

  aircraft
  .forEach(

    function(ac){


      if(
        ac.lat == null ||
        ac.lon == null
      ){

        return;

      }


      const p =

        positionFromLatLon(
          ac.lat,
          ac.lon
        );


      if(
        p.distance >
        RANGE_KM
      ){

        return;

      }


      const r =

        p.distance /
        RANGE_KM *
        radius;


      const a =

        p.bearing *
        Math.PI /
        180;


      const x =

        cx +
        Math.sin(a) *
        r;


      const y =

        cy -
        Math.cos(a) *
        r;


      ctx.fillStyle =
        "#8cffaa";


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        3,
        0,
        Math.PI*2
      );


      ctx.fill();



      /* TRACK */

      if(
        ac.track != null
      ){

        const t =

          ac.track *
          Math.PI /
          180;


        ctx.strokeStyle =
          "#8cffaa";


        ctx.lineWidth =
          1;


        ctx.beginPath();


        ctx.moveTo(
          x,
          y
        );


        ctx.lineTo(

          x +
          Math.sin(t) *
          10,

          y -
          Math.cos(t) *
          10

        );


        ctx.stroke();

      }



      const label =

        (
          ac.flight ||
          ac.r ||
          ac.hex ||
          ""
        )
        .trim();


      ctx.font =
        "8px monospace";


      ctx.fillText(
        label,
        x+5,
        y-4
      );

    }

  );


  sweep =

    (
      sweep +
      .8
    )
    %
    360;


  requestAnimationFrame(
    drawRadar
  );

}


drawRadar();



/* =====================================
   WEATHER MAP
   ===================================== */

let weatherMap =
  null;


let rainLayer =
  null;


let rainFrames =
  [];


let rainHost =
  "";


let rainIndex =
  0;


let rainTimer =
  null;



function initWeatherMap(){


  if(
    weatherMap
  ){

    return;

  }


  weatherMap =

    L.map(
      "weatherMap",
      {

        zoomControl:
          false,

        attributionControl:
          true

      }
    )
    .setView(
      [
        LAT,
        LON
      ],
      7
    );


  L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom:
        19,

      attribution:
        "© OpenStreetMap"

    }

  )
  .addTo(
    weatherMap
  );


  L.circleMarker(

    [
      LAT,
      LON
    ],

    {

      radius:
        4,

      color:
        "#ffffff",

      fillColor:
        "#79ff9b",

      fillOpacity:
        1

    }

  )
  .addTo(
    weatherMap
  )
  .bindTooltip(
    "Siderno"
  );

}



/* =====================================
   RAINVIEWER
   ===================================== */

async function loadRainViewer(){


  try{


    const response =

      await fetch(

        "https://api.rainviewer.com/public/weather-maps.json"

      );


    const data =

      await response
      .json();


    rainHost =

      data.host;


    rainFrames =

      data.radar
      .past
      .slice(-6);


    rainIndex =
      0;


    showRainFrame();


    if(
      rainTimer
    ){

      clearInterval(
        rainTimer
      );

    }


    rainTimer =

      setInterval(

        function(){

          rainIndex =

            (
              rainIndex +
              1
            )
            %
            rainFrames.length;


          showRainFrame();

        },

        1200

      );

  }


  catch(error){


    document
    .getElementById(
      "rainTime"
    )
    .textContent =

      "RADAR OFFLINE";

  }

}



function showRainFrame(){


  if(
    !weatherMap ||
    !rainFrames.length
  ){

    return;

  }


  const frame =

    rainFrames[
      rainIndex
    ];


  if(
    rainLayer
  ){

    weatherMap
    .removeLayer(
      rainLayer
    );

  }


  rainLayer =

    L.tileLayer(

      rainHost +
      frame.path +
      "/256/{z}/{x}/{y}/2/1_1.png",

      {

        opacity:
          .70,

        maxZoom:
          7,

        attribution:
          "Radar RainViewer"

      }

    );


  rainLayer
  .addTo(
    weatherMap
  );


  const t =

    new Date(
      frame.time *
      1000
    );


  document
  .getElementById(
    "rainTime"
  )
  .textContent =

    "RADAR " +

    t.toLocaleTimeString(

      "it-IT",

      {

        hour:
          "2-digit",

        minute:
          "2-digit"

      }

    );

}

function weatherText(
  code
){

  if(code===0)
    return "SERENO";

  if(code<=3)
    return "PARZ. NUVOLOSO";

  if(code<=48)
    return "NEBBIA";

  if(code<=67)
    return "PIOGGIA";

  if(code<=77)
    return "NEVE";

  if(code<=82)
    return "ROVESCI";

  if(code>=95)
    return "TEMPORALE";

  return "VARIABILE";

}



async function loadWeather(){


  try{


    const url =

      "https://api.open-meteo.com/v1/forecast" +

      "?latitude=" +
      LAT +

      "&longitude=" +
      LON +

      "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" +

      "&hourly=temperature_2m,precipitation_probability" +

      "&forecast_hours=12" +

      "&timezone=Europe%2FRome";


    const response =

      await fetch(
        url
      );


    const d =

      await response
      .json();



    document
    .getElementById(
      "temperature"
    )
    .textContent =

      Math.round(
        d.current
        .temperature_2m
      )
      +
      "°";


    document
    .getElementById(
      "weatherDescription"
    )
    .textContent =

      weatherText(
        d.current
        .weather_code
      );


    document
    .getElementById(
      "windSpeed"
    )
    .textContent =

      Math.round(
        d.current
        .wind_speed_10m
      );


    document
    .getElementById(
      "humidity"
    )
    .textContent =

      d.current
      .relative_humidity_2m;


    document
    .getElementById(
      "rainProbability"
    )
    .textContent =

      d.hourly
      .precipitation_probability[0]
      ??
      "--";



    /* PREVISIONI FUTURE */

    const forecast =

      document
      .getElementById(
        "forecast"
      );


    forecast
    .innerHTML =
      "";


    /*
     Mostriamo:
     +0h
     +3h
     +6h
     +9h
    */

    const indexes =

      [
        0,
        3,
        6,
        9
      ];


    indexes
    .forEach(

      function(i){


        if(
          i >=
          d.hourly.time.length
        ){

          return;

        }


        const date =

          new Date(
            d.hourly
            .time[i]
          );


        const hour =

          date
          .getHours()
          .toString()
          .padStart(
            2,
            "0"
          );


        const div =

          document
          .createElement(
            "div"
          );


        div.className =
          "forecastItem";


        div.innerHTML =

          '<div class="forecastHour">' +

          hour +
          ':00' +

          '</div>' +

          '<div class="forecastTemp">' +

          Math.round(
            d.hourly
            .temperature_2m[i]
          ) +

          '°</div>' +

          '<div class="forecastRain">' +

          '☂ ' +

          d.hourly
          .precipitation_probability[i] +

          '%</div>';


        forecast
        .appendChild(
          div
        );

      }

    );

  }


  catch(error){


    document
    .getElementById(
      "weatherDescription"
    )
    .textContent =

      "METEO OFFLINE";

  }

}


setInterval(
  loadWeather,
  600000
);

function julianDate(
  date
){

  return

    date.getTime() /
    86400000

    +

    2440587.5;

}



function localSiderealTime(
  date
){

  const jd =

    date.getTime() /
    86400000

    +

    2440587.5;


  const d =

    jd -
    2451545.0;


  let gst =

    18.697374558

    +

    24.06570982441908 *
    d;


  let lst =

    gst

    +

    LON /
    15;


  lst =

    (
      lst % 24
      +
      24
    )
    %
    24;


  return lst;

}



/* RA/DEC -> ALT/AZ */

function starPosition(
  star,
  date
){

  const lst =

    localSiderealTime(
      date
    );


  const H =

    (
      lst -
      star.ra
    )
    *
    15
    *
    Math.PI /
    180;


  const dec =

    star.dec *
    Math.PI /
    180;


  const lat =

    LAT *
    Math.PI /
    180;


  const sinAlt =

    Math.sin(dec) *
    Math.sin(lat)

    +

    Math.cos(dec) *
    Math.cos(lat) *
    Math.cos(H);


  const alt =

    Math.asin(
      sinAlt
    );


  const y =

    -Math.sin(H) *
    Math.cos(dec);


  const x =

    Math.sin(dec) *
    Math.cos(lat)

    -

    Math.cos(dec) *
    Math.sin(lat) *
    Math.cos(H);


  let az =

    Math.atan2(
      y,
      x
    );


  if(
    az < 0
  ){

    az +=
      Math.PI *
      2;

  }


  return {

    alt:
      alt,

    az:
      az

  };

}



function drawSky(){


  const w =
    skyCanvas.width;


  const h =
    skyCanvas.height;


  skyCtx
  .clearRect(
    0,
    0,
    w,
    h
  );


  const cx =
    w/2;


  const cy =
    h/2;


  const radius =

    Math.min(
      w,
      h
    ) *
    .44;



  /* HORIZON */

  skyCtx
  .strokeStyle =

    "rgba(130,190,255,.35)";


  skyCtx
  .lineWidth =
    1;


  skyCtx
  .beginPath();


  skyCtx
  .arc(
    cx,
    cy,
    radius,
    0,
    Math.PI*2
  );


  skyCtx
  .stroke();



  /* ALTITUDE CIRCLES */

  [
    .33,
    .66
  ]
  .forEach(

    function(v){

      skyCtx
      .beginPath();


      skyCtx
      .arc(
        cx,
        cy,
        radius*v,
        0,
        Math.PI*2
      );


      skyCtx
      .stroke();

    }

  );



  /* CARDINALS */

  skyCtx
  .fillStyle =
    "#82baff";


  skyCtx
  .font =
    "10px monospace";


  skyCtx
  .fillText(
    "N",
    cx-3,
    cy-radius+12
  );


  skyCtx
  .fillText(
    "S",
    cx-3,
    cy+radius-5
  );


  skyCtx
  .fillText(
    "E",
    cx+radius-12,
    cy-4
  );


  skyCtx
  .fillText(
    "W",
    cx-radius+5,
    cy-4
  );



  const now =
    new Date();



  /* STARS */

  stars
  .forEach(

    function(star){


      const p =

        starPosition(
          star,
          now
        );


      if(
        p.alt <= 0
      ){

        return;

      }


      const altitude =

        p.alt /
        (
          Math.PI /
          2
        );


      const r =

        radius *
        (
          1 -
          altitude
        );


      const x =

        cx

        +

        Math.sin(
          p.az
        )
        *
        r;


      const y =

        cy

        -

        Math.cos(
          p.az
        )
        *
        r;



      const size =

        Math.max(
          1.5,
          4 -
          star.mag
        );


      skyCtx
      .fillStyle =
        "#d9ecff";


      skyCtx
      .beginPath();


      skyCtx
      .arc(
        x,
        y,
        size,
        0,
        Math.PI*2
      );


      skyCtx
      .fill();



      /* LABEL */

      if(
        star.mag <
        1.1
      ){

        skyCtx
        .font =
          "8px monospace";


        skyCtx
        .fillStyle =
          "#a8cfff";


        skyCtx
        .fillText(
          star.name,
          x+5,
          y-3
        );

      }

    }

  );


  /* ZENITH */

  skyCtx
  .fillStyle =
    "#6c9bc3";


  skyCtx
  .font =
    "8px monospace";


  skyCtx
  .fillText(
    "ZENIT",
    cx+5,
    cy-5
  );

}
