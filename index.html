<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Echo Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #080b10;
      color: white;

      font-family: Arial, sans-serif;
    }

    /* ==============================
       STRUTTURA PRINCIPALE
       ============================== */

    body {
      position: fixed;
      inset: 0;

      display: grid;

      /* TOPBAR / CONTENUTO / NAV */
      grid-template-rows:
        45px
        minmax(0, 1fr)
        60px;
    }


    /* ==============================
       BARRA SUPERIORE
       ============================== */

    #topbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 0 16px;

      background: #10151d;

      z-index: 100;
    }

    #clock {
      font-size: 23px;
      font-weight: bold;
    }

    #date {
      font-size: 14px;

      opacity: 0.7;
    }


    /* ==============================
       AREA CENTRALE
       ============================== */

    #content {
      position: relative;

      min-height: 0;

      overflow: hidden;

      background: #05080d;
    }


    /* ==============================
       PAGINE
       ============================== */

    .page {
      display: none;

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;
    }

    .page.active {
      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* ==============================
       ADS-B
       ============================== */

    #aircraft {
      background: #05080d;
    }

    #aircraft iframe {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }


    /* ==============================
       PLACEHOLDER RADAR / METEO
       ============================== */

    .placeholder {
      text-align: center;

      font-size: 26px;
    }

    .placeholder small {
      display: block;

      margin-top: 8px;

      font-size: 15px;

      opacity: 0.6;
    }


    /* ==============================
       NAVIGAZIONE INFERIORE
       ============================== */

    #nav {
      display: flex;

      width: 100%;
      height: 60px;

      background: #10151d;

      z-index: 1000;
    }

    #nav button {
      flex: 1;

      height: 60px;

      margin: 0;
      padding: 0;

      border: 0;

      background: #10151d;

      color: #aaa;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #nav button.active {
      color: white;

      background: #1b2430;
    }

    #nav button:active {
      background: #263241;
    }

  </style>

</head>


<body>


  <!-- ==============================
       TOP BAR
       ============================== -->

  <div id="topbar">

    <div id="clock">
      --:--
    </div>

    <div id="date">
      ---
    </div>

  </div>



  <!-- ==============================
       CONTENUTO
       ============================== -->

  <div id="content">


    <!-- AEREI -->

    <div id="aircraft"
         class="page active">

      <iframe
        src="https://globe.adsb.fi/"
        allowfullscreen>
      </iframe>

    </div>



    <!-- RADAR -->

    <div id="radar"
         class="page">

      <div class="placeholder">

        🌧️ RADAR

        <small>
          Radar meteo
        </small>

      </div>

    </div>



    <!-- METEO -->

    <div id="weather"
         class="page">

      <div class="placeholder">

        ☀️ METEO

        <small>
          Previsioni meteo
        </small>

      </div>

    </div>


  </div>



  <!-- ==============================
       NAVIGAZIONE
       ============================== -->

  <div id="nav">

    <button
      class="active"
      onclick="showPage('aircraft', this)">

      ✈️ AEREI

    </button>


    <button
      onclick="showPage('radar', this)">

      🌧️ RADAR

    </button>


    <button
      onclick="showPage('weather', this)">

      ☀️ METEO

    </button>

  </div>



  <!-- ==============================
       JAVASCRIPT
       ============================== -->

  <script>


    /* ------------------------------
       OROLOGIO
       ------------------------------ */

    function updateClock() {

      const now = new Date();


      document.getElementById("clock").textContent =
        now.toLocaleTimeString(
          "it-IT",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      document.getElementById("date").textContent =
        now.toLocaleDateString(
          "it-IT",
          {
            weekday: "short",
            day: "numeric",
            month: "short"
          }
        ).toUpperCase();

    }


    updateClock();

    setInterval(
      updateClock,
      1000
    );



    /* ------------------------------
       CAMBIO PAGINA
       ------------------------------ */

    function showPage(id, button) {


      /* Nasconde tutte le pagine */

      document
        .querySelectorAll(".page")
        .forEach(
          page =>
            page.classList.remove("active")
        );


      /* Mostra quella selezionata */

      document
        .getElementById(id)
        .classList.add("active");


      /* Rimuove active dai pulsanti */

      document
        .querySelectorAll("#nav button")
        .forEach(
          btn =>
            btn.classList.remove("active")
        );


      /* Evidenzia il pulsante */

      button.classList.add("active");

    }


  </script>


</body>

</html>
