<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Echo Station</title>

<!-- KEEP SILK OPEN -->
<script defer
src="https://dagammla.gitlab.io/keep-silk-open/keep.js">
</script>

<!-- LEAFLET -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #020805;
  color: #79ff9b;

  font-family: Arial, sans-serif;

  touch-action: manipulation;
}

body {
  position: fixed;
  inset: 0;

  display: grid;

  grid-template-rows:
    38px
    minmax(0,1fr)
    54px;
}


/* =========================
   TOP
   ========================= */

#topbar {

  display: flex;

  align-items: center;
  justify-content: space-between;

  padding: 0 13px;

  background: #06100b;

  border-bottom:
    1px solid #1d6b37;

  z-index: 1000;
}

#stationName {

  font-size: 14px;

  font-weight: bold;

  letter-spacing: 2px;
}

#clock {

  font-size: 20px;

  font-weight: bold;
}


/* =========================
   CONTENT
   ========================= */

#content {

  position: relative;

  min-height: 0;

  overflow: hidden;
}

.page {

  display: none;

  position: absolute;

  inset: 0;
}

.page.active {

  display: block;
}


/* =========================
   NAV
   ========================= */

#nav {

  display: flex;

  background: #06100b;

  border-top:
    1px solid #1d6b37;

  z-index: 1000;
}

#nav button {

  flex: 1;

  border: 0;

  background: transparent;

  color: #568c65;

  font-size: 15px;

  font-weight: bold;
}

#nav button.active {

  color: #9affb0;

  background: #0c1e13;
}


/* =========================
   RADAR AEREI
   ========================= */

#airRadarPage {

  background:
    radial-gradient(
      circle at center,
      #07180e,
      #010503 72%
    );
}

#radarCanvas {

  width: 100%;

  height: 100%;

  display: block;
}

#radarStatus {

  position: absolute;

  bottom: 5px;

  left: 7px;

  font-family: monospace;

  font-size: 9px;

  color: #79ff9b;

  pointer-events: none;
}

#adsbButton {

  position: absolute;

  right: 7px;

  top: 7px;

  padding: 5px 8px;

  border: 1px solid #397c4c;

  background:
    rgba(0,10,5,.8);

  color: #79ff9b;

  font-size: 10px;

  z-index: 5;
}


/* =========================
   METEO
   ========================= */

#weatherPage {

  background: #020805;
}

#weatherLayout {

  display: grid;

  grid-template-columns:
    67% 33%;

  width: 100%;

  height: 100%;
}

#weatherMap {

  width: 100%;

  height: 100%;
}

#weatherPanel {

  padding: 8px;

  overflow: hidden;

  background: #07110c;

  border-left:
    1px solid #1d6b37;
}

#temperature {

  font-size: 42px;

  font-weight: bold;

  line-height: 1;
}

#weatherDescription {

  margin-top: 3px;

  font-size: 12px;

  font-weight: bold;
}

#weatherDetails {

  margin-top: 8px;

  font-size: 11px;

  line-height: 1.55;
}

#forecast {

  margin-top: 8px;

  padding-top: 6px;

  border-top:
    1px solid #205d31;

  font-family: monospace;

  font-size: 9px;

  line-height: 1.55;
}

#rainTime {

  position: absolute;

  bottom: 5px;

  left: 5px;

  z-index: 900;

  padding: 3px 5px;

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 9px;
}


/* =========================
   SPAZIO
   ========================= */

#spaceLayout {

  display: grid;

  grid-template-columns:
    72% 28%;

  width: 100%;

  height: 100%;
}

#spaceMap {

  width: 100%;

  height: 100%;
}

#spacePanel {

  padding: 8px;

  background: #06100b;

  border-left:
    1px solid #1d6b37;

  font-family: monospace;

  font-size: 10px;

  line-height: 1.55;
}

#issTitle {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 8px;
}

#issStatus {

  margin-top: 10px;

  padding-top: 6px;

  border-top:
    1px solid #1d6b37;
}


/* =========================
   LEAFLET DARK EFFECT
   ========================= */

.dark-map .leaflet-tile-pane {

  filter:
    brightness(.52)
    contrast(1.15)
    saturate(.45);
}

#spaceMap .leaflet-tile-pane {

  filter:
    brightness(.38)
    contrast(1.35)
    saturate(.35)
    hue-rotate(70deg);
}

.leaflet-control-attribution {

  font-size: 7px !important;

  background:
    rgba(0,0,0,.55) !important;

  color: #bbb !important;
}


/* =========================
   START
   ========================= */

#startup {

  position: fixed;

  inset: 0;

  z-index: 99999;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  background:
    radial-gradient(
      circle,
      #0b2414,
      #010503 70%
    );
}

#startupIcon {

  font-size: 55px;
}

#startupTitle {

  margin-top: 10px;

  font-size: 26px;

  font-weight: bold;

  letter-spacing: 3px;
}

#startupText {

  margin-top: 8px;

  font-size: 12px;

  opacity: .65;
}

</style>

</head>


<body>

<div id="startup"
onclick="startDashboard()">

  <div id="startupIcon">
    ◎
  </div>

  <div id="startupTitle">
    ECHO STATION
  </div>

  <div id="startupText">
    TOCCA PER AVVIARE
  </div>

</div>



<!-- TOP -->

<div id="topbar">

  <div id="stationName">
    SIDERO STATION
  </div>

  <div id="clock">
    --:--
  </div>

</div>



<!-- CONTENT -->

<div id="content">


<!-- AIR RADAR -->

<div
id="airRadarPage"
class="page active">

  <canvas
  id="radarCanvas">
  </canvas>

  <button
  id="adsbButton"
  onclick="openAdsb()">

    MAP

  </button>

  <div
  id="radarStatus">

    CONNECTING ADS-B...

  </div>

</div>



<!-- WEATHER -->

<div
id="weatherPage"
class="page">

  <div id="weatherLayout">

    <div style="position:relative">

      <div
      id="weatherMap"
      class="dark-map">
      </div>

      <div id="rainTime">
        RADAR --
      </div>

    </div>


    <div id="weatherPanel">

      <div id="temperature">
        --°
      </div>

      <div id="weatherDescription">
        CARICAMENTO
      </div>

      <div id="weatherDetails">

        💧 PIOGGIA
        <span id="rainProbability">
          --
        </span>%<br>

        💨 VENTO
        <span id="windSpeed">
          --
        </span> km/h<br>

        💦 UMID.
        <span id="humidity">
          --
        </span>%

      </div>

      <div id="forecast">
        ---
      </div>

    </div>

  </div>

</div>



<!-- SPACE -->

<div
id="spacePage"
class="page">

  <div id="spaceLayout">

    <div
    id="spaceMap">
    </div>

    <div id="spacePanel">

      <div id="issTitle">
        ISS
      </div>

      LAT
      <span id="issLat">
        --
      </span>°<br>

      LON
      <span id="issLon">
        --
      </span>°<br>

      ALT
      <span id="issAlt">
        --
      </span> km<br>

      VEL
      <span id="issVel">
        --
      </span><br>

      <div id="issStatus">

        ● LIVE<br><br>

        ○ SIDERO

      </div>

    </div>

  </div>

</div>


</div>



<!-- NAV -->

<div id="nav">

  <button
  class="active"
  onclick="
  showPage(
    'airRadarPage',
    this
  )">

    ✈ RADAR

  </button>


  <button
  onclick="
  showPage(
    'weatherPage',
    this
  )">

    🌦 METEO

  </button>


  <button
  onclick="
  showPage(
    'spacePage',
    this
  )">

    🛰 SPAZIO

  </button>

</div>



<script>

/* =========================
   CONFIG
   ========================= */

const LAT = 38.27;
const LON = 16.30;

const RANGE_KM = 200;

const ADSB_NM = 110;



/* =========================
   CLOCK
   ========================= */

function updateClock(){

  const d =
    new Date();

  document
  .getElementById("clock")
  .textContent =
    d.toLocaleTimeString(
      "it-IT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

updateClock();

setInterval(
  updateClock,
  1000
);



/* =========================
   START
   ========================= */

function startDashboard(){

  const el =
    document.documentElement;

  try{

    if(el.requestFullscreen){

      el.requestFullscreen();

    }

    else if(
      el.webkitRequestFullscreen
    ){

      el.webkitRequestFullscreen();

    }

  }
  catch(e){}


  document
  .getElementById("startup")
  .style.display="none";


  resizeRadar();

  initWeatherMap();

  initSpaceMap();


  loadAircraft();

  loadWeather();

  loadRainViewer();

  loadISS();

}



/* =========================
   NAV
   ========================= */

function showPage(id,button){

  document
  .querySelectorAll(".page")
  .forEach(
    p =>
    p.classList.remove("active")
  );


  document
  .getElementById(id)
  .classList.add("active");


  document
  .querySelectorAll("#nav button")
  .forEach(
    b =>
    b.classList.remove("active")
  );


  button
  .classList
  .add("active");


  /*
   Leaflet deve ricalcolare
   la dimensione dopo essere
   diventato visibile.
  */

  setTimeout(
    function(){

      if(
        id==="weatherPage" &&
        weatherMap
      ){

        weatherMap
        .invalidateSize();

      }


      if(
        id==="spacePage" &&
        spaceMap
      ){

        spaceMap
          .invalidateSize();

      }

    },
    100
  );

}



/* =========================
   ADSB MAP BUTTON
   ========================= */

function openAdsb(){

  window.location.href =
    "https://globe.adsb.fi/?SiteLat=38.27&SiteLon=16.30&centerReceiver&zoom=7&hideSideBar";

}



/* =========================
   AIRCRAFT RADAR
   ========================= */

const radarCanvas =
  document
  .getElementById(
    "radarCanvas"
  );

const ctx =
  radarCanvas
  .getContext("2d");


let aircraft = [];

let sweep = 0;



function resizeRadar(){

  radarCanvas.width =
    radarCanvas.clientWidth;

  radarCanvas.height =
    radarCanvas.clientHeight;

}


window.addEventListener(
  "resize",
  resizeRadar
);



function positionFromLatLon(
  lat,
  lon
){

  const R=6371;

  const p1 =
    LAT*Math.PI/180;

  const p2 =
    lat*Math.PI/180;

  const dp =
    (lat-LAT)*
    Math.PI/180;

  const dl =
    (lon-LON)*
    Math.PI/180;


  const a =
    Math.sin(dp/2)**
    2 +

    Math.cos(p1)*
    Math.cos(p2)*

    Math.sin(dl/2)**
    2;


  const distance =

    2*R*

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );


  const y =
    Math.sin(dl)*
    Math.cos(p2);


  const x =

    Math.cos(p1)*
    Math.sin(p2)

    -

    Math.sin(p1)*
    Math.cos(p2)*
    Math.cos(dl);


  const bearing =

    (
      Math.atan2(y,x)*
      180/Math.PI
      +360
    )%360;


  return {
    distance,
    bearing
  };

}



async function loadAircraft(){

  try{

    const url =

      "https://opendata.adsb.fi/api/v3/lat/"+
      LAT+
      "/lon/"+
      LON+
      "/dist/"+
      ADSB_NM;


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "HTTP "+
        response.status
      );

    }


    const data =
      await response.json();


    aircraft =
      data.ac || [];


    document
    .getElementById(
      "radarStatus"
    )
    .textContent =

      "ADS-B.FI • "+
      aircraft.length+
      " TARGETS • 200 KM";


  }

  catch(error){

    document
    .getElementById(
      "radarStatus"
    )
    .textContent =

      "ADS-B ERROR • "+
      error.message;

  }

}


setInterval(
  loadAircraft,
  5000
);



function drawRadar(){

  const w =
    radarCanvas.width;

  const h =
    radarCanvas.height;


  ctx.clearRect(
    0,0,w,h
  );


  const cx=w/2;

  const cy=h/2;

  const radius =

    Math.min(w,h)*
    .46;


  /* RANGE RINGS */

  ctx.strokeStyle =
    "rgba(100,255,140,.24)";

  ctx.lineWidth=1;


  for(
    let i=1;
    i<=4;
    i++
  ){

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      radius*i/4,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  /* CROSS */

  ctx.beginPath();

  ctx.moveTo(
    cx-radius,
    cy
  );

  ctx.lineTo(
    cx+radius,
    cy
  );

  ctx.moveTo(
    cx,
    cy-radius
  );

  ctx.lineTo(
    cx,
    cy+radius
  );

  ctx.stroke();


  /* CARDINALS */

  ctx.fillStyle =
    "#79ff9b";

  ctx.font =
    "10px monospace";

  ctx.fillText(
    "N",
    cx-3,
    cy-radius+11
  );

  ctx.fillText(
    "S",
    cx-3,
    cy+radius-4
  );

  ctx.fillText(
    "W",
    cx-radius+5,
    cy-4
  );

  ctx.fillText(
    "E",
    cx+radius-11,
    cy-4
  );


  /* RANGE */

  ctx.fillStyle =
    "rgba(120,255,150,.6)";

  ctx.font =
    "8px monospace";


  [50,100,150,200]
  .forEach(
    function(km,index){

      ctx.fillText(
        km+
        (km===200 ?
          "KM" :
          ""
        ),

        cx+
        radius*
        (index+1)/4+
        2,

        cy-2
      );

    }
  );


  /* SWEEP */

  const angle =
    sweep*
    Math.PI/180;


  ctx.strokeStyle =
    "rgba(110,255,140,.65)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    cx,
    cy
  );

  ctx.lineTo(

    cx+
    Math.sin(angle)*
    radius,

    cy-
    Math.cos(angle)*
    radius

  );

  ctx.stroke();


  /* SIDERO */

  ctx.fillStyle =
    "#ffffff";

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.font =
    "8px monospace";

  ctx.fillText(
    "SIDERO",
    cx+5,
    cy-5
  );


  /* AIRCRAFT */

  aircraft.forEach(
    function(ac){

      if(
        ac.lat==null ||
        ac.lon==null
      ){

        return;

      }


      const p =
        positionFromLatLon(
          ac.lat,
          ac.lon
        );


      if(
        p.distance >
        RANGE_KM
      ){

        return;

      }


      const r =

        p.distance/
        RANGE_KM*
        radius;


      const a =

        p.bearing*
        Math.PI/180;


      const x =

        cx+
        Math.sin(a)*r;


      const y =

        cy-
        Math.cos(a)*r;


      ctx.fillStyle =
        "#8cffaa";


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        3,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* HEADING */

      if(
        ac.track!=null
      ){

        const t =

          ac.track*
          Math.PI/180;


        ctx.strokeStyle =
          "#8cffaa";

        ctx.lineWidth=1;


        ctx.beginPath();

        ctx.moveTo(
          x,
          y
        );

        ctx.lineTo(

          x+
          Math.sin(t)*10,

          y-
          Math.cos(t)*10

        );

        ctx.stroke();

      }


      /* CALLSIGN */

      const label =

        (
          ac.flight ||
          ac.r ||
          ac.hex ||
          ""
        ).trim();


      ctx.font =
        "8px monospace";


      ctx.fillText(
        label,
        x+5,
        y-4
      );

    }
  );


  sweep =
    (sweep+.8)%360;


  requestAnimationFrame(
    drawRadar
  );

}


drawRadar();



/* =========================
   WEATHER MAP
   ========================= */

let weatherMap=null;

let rainLayer=null;

let rainFrames=[];

let rainHost="";

let rainIndex=0;

let rainTimer=null;



function initWeatherMap(){

  if(weatherMap)
    return;


  weatherMap =

    L.map(
      "weatherMap",
      {
        zoomControl:false,
        attributionControl:true
      }
    )
    .setView(
      [LAT,LON],
      7
    );


  L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
      maxZoom:19,

      attribution:
        "© OpenStreetMap"
    }

  ).addTo(
    weatherMap
  );


  L.circleMarker(
    [LAT,LON],
    {
      radius:4,
      color:"#ffffff",
      fillColor:"#79ff9b",
      fillOpacity:1
    }
  )
  .addTo(
    weatherMap
  )
  .bindTooltip(
    "Siderno"
  );

}



/* =========================
   RAINVIEWER
   ========================= */

async function loadRainViewer(){

  try{

    const response =
      await fetch(
        "https://api.rainviewer.com/public/weather-maps.json"
      );


    const data =
      await response.json();


    rainHost =
      data.host;


    rainFrames =
      data.radar.past
      .slice(-6);


    if(
      !rainFrames.length
    ){

      throw new Error(
        "No frames"
      );

    }


    rainIndex=0;

    showRainFrame();


    if(rainTimer){

      clearInterval(
        rainTimer
      );

    }


    rainTimer =
      setInterval(
        function(){

          rainIndex =
            (
              rainIndex+1
            )%
            rainFrames.length;


          showRainFrame();

        },
        1200
      );

  }

  catch(error){

    document
    .getElementById(
      "rainTime"
    )
    .textContent =
      "RADAR ERROR";

  }

}



function showRainFrame(){

  if(
    !weatherMap ||
    !rainFrames.length
  ){

    return;

  }


  const frame =
    rainFrames[rainIndex];


  if(rainLayer){

    weatherMap
    .removeLayer(
      rainLayer
    );

  }


  const tileURL =

    rainHost+
    frame.path+
    "/256/{z}/{x}/{y}/2/1_1.png";


  rainLayer =

    L.tileLayer(
      tileURL,
      {
        opacity:.70,
        maxZoom:7,

        attribution:
          "Radar: RainViewer"
      }
    );


  rainLayer.addTo(
    weatherMap
  );


  const t =
    new Date(
      frame.time*1000
    );


  document
  .getElementById(
    "rainTime"
  )
  .textContent =

    "RADAR "+
    t.toLocaleTimeString(
      "it-IT",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}



/* =========================
   WEATHER DATA
   ========================= */

function weatherText(code){

  if(code===0)
    return "SERENO";

  if(code<=3)
    return "PARZ. NUVOLOSO";

  if(code<=48)
    return "NEBBIA";

  if(code<=67)
    return "PIOGGIA";

  if(code<=77)
    return "NEVE";

  if(code<=82)
    return "ROVESCI";

  if(code>=95)
    return "TEMPORALE";

  return "VARIABILE";

}



async function loadWeather(){

  try{

    const url =

      "https://api.open-meteo.com/v1/forecast"+
      "?latitude="+LAT+
      "&longitude="+LON+
      "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"+
      "&hourly=temperature_2m,precipitation_probability"+
      "&forecast_hours=8"+
      "&timezone=Europe%2FRome";


    const response =
      await fetch(url);


    const d =
      await response.json();


    document
    .getElementById(
      "temperature"
    )
    .textContent =

      Math.round(
        d.current
        .temperature_2m
      )+"°";


    document
    .getElementById(
      "weatherDescription"
    )
    .textContent =

      weatherText(
        d.current
        .weather_code
      );


    document
    .getElementById(
      "windSpeed"
    )
    .textContent =

      Math.round(
        d.current
        .wind_speed_10m
      );


    document
    .getElementById(
      "humidity"
    )
    .textContent =

      d.current
      .relative_humidity_2m;


    document
    .getElementById(
      "rainProbability"
    )
    .textContent =

      d.hourly
      .precipitation_probability[0]
      ?? "--";


    let forecast="";


    for(
      let i=0;
      i<5;
      i++
    ){

      const date =

        new Date(
          d.hourly.time[i]
        );


      const hh =

        date
        .getHours()
        .toString()
        .padStart(
          2,
          "0"
        );


      forecast +=

        hh+
        ":00  "+
        Math.round(
          d.hourly
          .temperature_2m[i]
        )+
        "°  ☂"+
        d.hourly
        .precipitation_probability[i]+
        "%<br>";

    }


    document
    .getElementById(
      "forecast"
    )
    .innerHTML =
      forecast;

  }

  catch(e){

    document
    .getElementById(
      "weatherDescription"
    )
    .textContent =
      "METEO OFFLINE";

  }

}


setInterval(
  loadWeather,
  600000
);



/* =========================
   SPACE MAP
   ========================= */

let spaceMap=null;

let issMarker=null;

let issTrail=null;

let issHistory=[];



function initSpaceMap(){

  if(spaceMap)
    return;


  spaceMap =

    L.map(
      "spaceMap",
      {
        zoomControl:false,
        attributionControl:true,
        worldCopyJump:true
      }
    )
    .setView(
      [15,10],
      1
    );


  L.tileLayer(

    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
      maxZoom:5,

      attribution:
        "© OpenStreetMap"
    }

  )
  .addTo(
    spaceMap
  );


  /* SIDERO */

  L.circleMarker(

    [LAT,LON],

    {
      radius:4,

      color:"#ffffff",

      fillColor:"#ffffff",

      fillOpacity:1
    }

  )
  .addTo(
    spaceMap
  )
  .bindTooltip(
    "SIDERO"
  );

}



/* =========================
   ISS
   ========================= */

async function loadISS(){

  try{

    const response =
      await fetch(
        "https://api.wheretheiss.at/v1/satellites/25544"
      );


    if(!response.ok){

      throw new Error(
        "ISS HTTP "+
        response.status
      );

    }


    const d =
      await response.json();


    const pos =
      [
        d.latitude,
        d.longitude
      ];


    document
    .getElementById(
      "issLat"
    )
    .textContent =
      d.latitude
      .toFixed(1);


    document
    .getElementById(
      "issLon"
    )
    .textContent =
      d.longitude
      .toFixed(1);


    document
    .getElementById(
      "issAlt"
    )
    .textContent =
      Math.round(
        d.altitude
      );


    document
    .getElementById(
      "issVel"
    )
    .textContent =

      Math.round(
        d.velocity
      )
      .toLocaleString(
        "it-IT"
      )+
      " km/h";


    if(!issMarker){

      issMarker =

        L.circleMarker(
          pos,
          {
            radius:7,

            color:"#79ff9b",

            fillColor:
              "#79ff9b",

            fillOpacity:1
          }
        )
        .addTo(
          spaceMap
        )
        .bindTooltip(
          "ISS",
          {
            permanent:true,
            direction:"right"
          }
        );

    }

    else{

      issMarker
      .setLatLng(
        pos
      );

    }


    /*
     Conserviamo una breve
     traccia recente.
    */

    issHistory.push(
      pos
    );


    if(
      issHistory.length>60
    ){

      issHistory.shift();

    }


    if(issTrail){

      spaceMap
      .removeLayer(
        issTrail
      );

    }


    issTrail =

      L.polyline(
        issHistory,
        {
          color:"#79ff9b",
          weight:1,
          opacity:.65
        }
      )
      .addTo(
        spaceMap
      );


    document
    .getElementById(
      "issStatus"
    )
    .innerHTML =

      "● LIVE<br><br>"+
      "○ SIDERO";


  }

  catch(error){

    document
    .getElementById(
      "issStatus"
    )
    .innerHTML =

      "ISS OFFLINE<br>"+
      error.message;

  }

}


setInterval(
  loadISS,
  10000
);

</script>
