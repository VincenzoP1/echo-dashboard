<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Siderno Station</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020705;color:#72ff91;font-family:"Courier New",monospace}
:root{--green:#72ff91;--green2:#42b85f;--dim:#235f36;--black:#020705;--panel:#06100b;--line:rgba(114,255,145,.28)}
#app{position:fixed;inset:0;background:var(--black)}
#topbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(2,7,5,.97);z-index:100}
.brand{font-weight:bold;letter-spacing:2px;font-size:15px} #clock{font-size:15px}
.screen{display:none;position:absolute;left:0;right:0;top:46px;bottom:55px;overflow:hidden}.screen.active{display:block}
#nav{position:absolute;left:0;right:0;bottom:0;height:55px;display:flex;background:#030a06;border-top:1px solid var(--line);z-index:100}
.navbtn{flex:1;border:0;border-right:1px solid var(--line);background:transparent;color:#398c50;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1px}.navbtn:last-child{border-right:0}.navbtn.active{color:var(--green);background:rgba(114,255,145,.07)}
#radarScreen{background:#020705}#radarMap{position:absolute;inset:0;z-index:0;opacity:1;pointer-events:none}#radarShade{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at center,rgba(0,0,0,.02),rgba(0,5,2,.15));pointer-events:none}
#radarCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
#radarStatus{position:absolute;top:9px;left:11px;z-index:5;font-size:10px;line-height:1.5;color:#4aaa64;pointer-events:none}#aircraftCount{color:var(--green)}
#planeInfo{position:absolute;top:8px;right:8px;width:175px;display:none;padding:9px;z-index:20;background:rgba(2,10,6,.96);border:1px solid rgba(114,255,145,.5);font-size:11px;line-height:1.45}#planeInfo .callsign{font-size:16px;color:#c1ffce;margin-bottom:4px}#planeInfo .close{position:absolute;top:4px;right:7px;font-size:17px}
#weatherScreen{background:#020705}#weatherMap{position:absolute;left:0;top:0;bottom:0;width:59%;background:#020705}
.weather-panel{position:absolute;right:0;top:0;bottom:0;width:41%;padding:11px;background:rgba(4,14,8,.98);border-left:1px solid var(--line);overflow:hidden;z-index:20}
.weather-place{font-size:10px;color:#4aaa64;letter-spacing:2px}.weather-main{display:flex;align-items:center;gap:8px;margin-top:3px}#weatherIcon{font-size:27px}#temperature{font-size:33px;color:#bdffca}#weatherDescription{font-size:11px;margin-top:1px}
.weather-details{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;padding-bottom:9px;border-bottom:1px solid var(--line);font-size:9px;color:#65bc78}.weather-details span{color:#a7f6b7}
.forecast-title{margin-top:9px;margin-bottom:5px;font-size:9px;letter-spacing:2px;color:#4aaa64}#forecast{display:flex;flex-direction:column;gap:4px}.forecast-row{display:grid;grid-template-columns:38px 24px 40px 1fr;align-items:center;min-height:27px;padding:3px 4px;background:rgba(114,255,145,.035);border-left:2px solid #205d35;font-size:9px}.fc-time{color:#4aaa64}.fc-temp{color:#bdffca}.fc-rain{text-align:right;color:#67b97a}
#radarTime{position:absolute;left:7px;bottom:7px;z-index:10;padding:4px 6px;background:rgba(0,0,0,.75);border:1px solid rgba(114,255,145,.18);font-size:9px;color:#93dfa3}.maplibregl-control-container{display:none!important}
#skyScreen{background:radial-gradient(circle at center,#07110c 0%,#020504 72%)}#skyCanvas{position:absolute;inset:0;width:100%;height:100%}#skyInfo{position:absolute;top:10px;left:12px;font-size:11px;line-height:1.5;color:#4aaa64}#skyInfo strong{color:var(--green)}#skyLegend{position:absolute;right:10px;bottom:8px;font-size:9px;color:#3c8850}
</style>
</head>
<body>
<div id="app">
<div id="topbar"><div class="brand">SIDERNO STATION</div><div id="clock">--:--</div></div>
<div id="radarScreen" class="screen active"><div id="radarMap"></div><div id="radarShade"></div><canvas id="radarCanvas"></canvas><div id="radarStatus">ADS-B LIVE<br>RANGE 200 KM<br>AIRCRAFT <span id="aircraftCount">--</span></div><div id="planeInfo"></div></div>
<div id="weatherScreen" class="screen"><div id="weatherMap"></div><div id="radarTime">RADAR --</div><div class="weather-panel"><div class="weather-place">SIDERNO • METEO</div><div class="weather-main"><div id="weatherIcon">--</div><div id="temperature">--°</div></div><div id="weatherDescription">Caricamento...</div><div class="weather-details"><div>PERCEPITA<br><span id="feels">--°</span></div><div>UMIDITÀ<br><span id="humidity">--%</span></div><div>VENTO<br><span id="wind">--</span></div><div>PIOGGIA<br><span id="rainNow">--</span></div></div><div class="forecast-title">PROSSIME ORE</div><div id="forecast"></div></div></div>
<div id="skyScreen" class="screen"><canvas id="skyCanvas"></canvas><div id="skyInfo"><strong>CIELO • SIDERNO</strong><br>LIVE SKY MAP<br><span id="skyDate"></span></div><div id="skyLegend">CENTRO = ZENIT • BORDO = ORIZZONTE</div></div>
<div id="nav"><button class="navbtn active" data-screen="radarScreen">✈ RADAR</button><button class="navbtn" data-screen="weatherScreen">☁ METEO</button><button class="navbtn" data-screen="skyScreen">✦ CIELO</button></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
var LAT=38.27,LON=16.30,MAX_RANGE=200,ADSB_URL="https://echo-show.akagigino.workers.dev/",SWEEP_TIME=10000;
function updateClock(){var d=new Date();document.getElementById("clock").innerHTML=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)} updateClock();setInterval(updateClock,10000);
var buttons=document.getElementsByClassName("navbtn");
for(var b=0;b<buttons.length;b++){buttons[b].onclick=function(){var screens=document.getElementsByClassName("screen");for(var i=0;i<screens.length;i++)screens[i].className="screen";for(var j=0;j<buttons.length;j++)buttons[j].className="navbtn";var name=this.getAttribute("data-screen");document.getElementById(name).className="screen active";this.className="navbtn active";if(name==="radarScreen")setTimeout(function(){if(radarMap)radarMap.resize();resizeRadar()},100);if(name==="weatherScreen")setTimeout(function(){if(weatherMap)weatherMap.resize()},100);if(name==="skyScreen")drawSky()}}

/* FULLSCREEN */
document.body.addEventListener("dblclick",function(){var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()});

/* WAKE LOCK — separate from Keep Silk Open */
var wakeLock=null;
async function requestWakeLock(){if(!("wakeLock" in navigator)){console.log("Wake Lock non supportato");return}try{wakeLock=await navigator.wakeLock.request("screen");console.log("Wake Lock attivo")}catch(err){console.log("Wake Lock:",err)}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")requestWakeLock()});
document.addEventListener("click",function enableWakeLock(){requestWakeLock();document.removeEventListener("click",enableWakeLock)});
requestWakeLock();

var radarMap=null,weatherMap=null;
function stripMapStyle(style,radarMode){if(!style.layers)return style;for(var i=0;i<style.layers.length;i++){var layer=style.layers[i],id=(layer.id||"").toLowerCase();if(layer.layout&&layer.layout["text-field"])layer.layout.visibility="none";if(id.indexOf("road")>=0||id.indexOf("street")>=0||id.indexOf("motorway")>=0||id.indexOf("highway")>=0||id.indexOf("poi")>=0||id.indexOf("transit")>=0||id.indexOf("rail")>=0||id.indexOf("airport")>=0||id.indexOf("aeroway")>=0||id.indexOf("building")>=0||id.indexOf("label")>=0||id.indexOf("place")>=0){if(!layer.layout)layer.layout={};layer.layout.visibility="none"}if(radarMode&&layer.paint){if(layer.type==="background")layer.paint["background-color"]="#020705";if(layer.type==="fill"){layer.paint["fill-color"]="#0b1c10";layer.paint["fill-opacity"]=.72}if(layer.type==="line"){layer.paint["line-color"]="#1d5530";layer.paint["line-opacity"]=.42;layer.paint["line-width"]=1}}}return style}
fetch("https://tiles.openfreemap.org/styles/dark").then(r=>r.json()).then(function(style){var rs=stripMapStyle(JSON.parse(JSON.stringify(style)),true);radarMap=new maplibregl.Map({container:"radarMap",style:rs,center:[LON,LAT],zoom:6.3,bearing:0,pitch:0,interactive:false,attributionControl:false});radarMap.on("load",resizeRadar);var ws=stripMapStyle(JSON.parse(JSON.stringify(style)),false);weatherMap=new maplibregl.Map({container:"weatherMap",style:ws,center:[LON,LAT],zoom:6.4,bearing:0,pitch:0,interactive:false,attributionControl:false});weatherMap.on("load",loadRainRadar)}).catch(err=>console.log("Map error:",err));

function haversine(lat1,lon1,lat2,lon2){var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
var radar=document.getElementById("radarCanvas"),rctx=radar.getContext("2d"),aircraft=[],planeHitAreas=[],trails={},sweepStart=Date.now();
function resizeRadar(){radar.width=radar.clientWidth*window.devicePixelRatio;radar.height=radar.clientHeight*window.devicePixelRatio;rctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0)}
function drawPlane(ctx,x,y,heading){ctx.save();ctx.translate(x,y);ctx.rotate(heading*Math.PI/180);ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(3,-2);ctx.lineTo(10,1);ctx.lineTo(10,3);ctx.lineTo(3,2);ctx.lineTo(2,7);ctx.lineTo(5,9);ctx.lineTo(5,10);ctx.lineTo(0,8);ctx.lineTo(-5,10);ctx.lineTo(-5,9);ctx.lineTo(-2,7);ctx.lineTo(-3,2);ctx.lineTo(-10,3);ctx.lineTo(-10,1);ctx.lineTo(-3,-2);ctx.closePath();ctx.strokeStyle="#72ff91";ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function getRadarGeometry(){var w=radar.clientWidth,h=radar.clientHeight,cx=w/2,cy=h/2,radius=Math.min(w*.39,h*.43);if(radarMap&&radarMap.loaded()){var cp=radarMap.project([LON,LAT]);cx=cp.x;cy=cp.y;var np=radarMap.project([LON,LAT+MAX_RANGE/111.32]);radius=Math.abs(cp.y-np.y)}return{w,h,cx,cy,radius}}
function drawRadar(){var g=getRadarGeometry(),w=g.w,h=g.h,cx=g.cx,cy=g.cy,radius=g.radius;rctx.clearRect(0,0,w,h);rctx.strokeStyle="rgba(114,255,145,.24)";rctx.lineWidth=1;for(var ring=1;ring<=4;ring++){rctx.beginPath();rctx.arc(cx,cy,radius*ring/4,0,Math.PI*2);rctx.stroke()}rctx.beginPath();rctx.moveTo(cx-radius,cy);rctx.lineTo(cx+radius,cy);rctx.moveTo(cx,cy-radius);rctx.lineTo(cx,cy+radius);rctx.stroke();rctx.fillStyle="#4aaa64";rctx.font="10px Courier New";rctx.textAlign="center";rctx.fillText("N",cx,cy-radius-7);rctx.fillText("S",cx,cy+radius+14);rctx.fillText("W",cx-radius-10,cy+3);rctx.fillText("E",cx+radius+10,cy+3);rctx.textAlign="left";["50","100","150"].forEach((v,k)=>rctx.fillText(v,cx+radius*((k+1)/4)+3,cy-3));rctx.fillText("200 KM",cx+radius+3,cy-3);rctx.fillStyle="#72ff91";rctx.fillRect(cx-2,cy-2,4,4);planeHitAreas=[];
for(var i=0;i<aircraft.length;i++){var p=aircraft[i];if(typeof p.lat!=="number"||typeof p.lon!=="number")continue;var dist=haversine(LAT,LON,p.lat,p.lon);if(dist>MAX_RANGE)continue;var x,y;if(radarMap&&radarMap.loaded()){var pr=radarMap.project([p.lon,p.lat]);x=pr.x;y=pr.y}else{var dx=(p.lon-LON)*Math.cos(LAT*Math.PI/180)*111.32,dy=(p.lat-LAT)*111.32;x=cx+dx/MAX_RANGE*radius;y=cy-dy/MAX_RANGE*radius}var id=p.hex||("p"+i);if(trails[id]&&trails[id].length>1){rctx.strokeStyle="rgba(74,190,99,.34)";rctx.lineWidth=1;rctx.beginPath();var started=false;for(var t=0;t<trails[id].length;t++){var pt=trails[id][t],tx,ty;if(radarMap&&radarMap.loaded()){var tp=radarMap.project([pt.lon,pt.lat]);tx=tp.x;ty=tp.y}else{var tdx=(pt.lon-LON)*Math.cos(LAT*Math.PI/180)*111.32,tdy=(pt.lat-LAT)*111.32;tx=cx+tdx/MAX_RANGE*radius;ty=cy-tdy/MAX_RANGE*radius}if(!started){rctx.moveTo(tx,ty);started=true}else rctx.lineTo(tx,ty)}rctx.stroke()}drawPlane(rctx,x,y,p.track||0);var call=p.flight?p.flight.replace(/\s/g,""):(p.hex||"----").toUpperCase();rctx.font="10px Courier New";rctx.textAlign="left";rctx.fillStyle="#aaffb9";rctx.fillText(call,x+10,y-3);if(typeof p.alt_baro==="number"){rctx.fillStyle="#4aaa64";rctx.fillText("FL"+Math.round(p.alt_baro/100),x+10,y+8)}planeHitAreas.push({x,y,plane:p,distance:dist})}
var progress=((Date.now()-sweepStart)%SWEEP_TIME)/SWEEP_TIME,sweep=progress*Math.PI*2-Math.PI/2,tail=.28,sg=rctx.createRadialGradient(cx,cy,0,cx,cy,radius);sg.addColorStop(0,"rgba(114,255,145,.02)");sg.addColorStop(1,"rgba(114,255,145,.13)");rctx.beginPath();rctx.moveTo(cx,cy);rctx.arc(cx,cy,radius,sweep-tail,sweep);rctx.closePath();rctx.fillStyle=sg;rctx.fill();var sx=cx+Math.cos(sweep)*radius,sy=cy+Math.sin(sweep)*radius,lg=rctx.createLinearGradient(cx,cy,sx,sy);lg.addColorStop(0,"rgba(114,255,145,.12)");lg.addColorStop(.6,"rgba(114,255,145,.55)");lg.addColorStop(1,"rgba(200,255,210,1)");rctx.beginPath();rctx.moveTo(cx,cy);rctx.lineTo(sx,sy);rctx.strokeStyle=lg;rctx.lineWidth=2;rctx.shadowColor="#72ff91";rctx.shadowBlur=7;rctx.stroke();rctx.shadowBlur=0}
function updateTrails(){for(var i=0;i<aircraft.length;i++){var p=aircraft[i];if(typeof p.lat!=="number"||typeof p.lon!=="number")continue;if(haversine(LAT,LON,p.lat,p.lon)>MAX_RANGE)continue;var id=p.hex||("p"+i);if(!trails[id])trails[id]=[];var list=trails[id],last=list.length?list[list.length-1]:null;if(!last||Math.abs(last.lat-p.lat)>.00005||Math.abs(last.lon-p.lon)>.00005)list.push({lat:p.lat,lon:p.lon,time:Date.now()});if(list.length>18)list.splice(0,list.length-18)}var now=Date.now();for(var key in trails){var arr=trails[key];if(!arr.length||now-arr[arr.length-1].time>300000)delete trails[key]}}
function loadAircraft(){fetch(ADSB_URL+"?t="+Date.now()).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(data){aircraft=data.ac||[];document.getElementById("aircraftCount").innerHTML=aircraft.length;updateTrails()}).catch(function(err){console.log("ADS-B:",err);document.getElementById("aircraftCount").innerHTML="OFF"})}
radar.addEventListener("click",function(e){var rect=radar.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,closest=null,best=24;for(var i=0;i<planeHitAreas.length;i++){var h=planeHitAreas[i],d=Math.sqrt((x-h.x)**2+(y-h.y)**2);if(d<best){best=d;closest=h}}if(closest)showPlaneInfo(closest.plane,closest.distance)});
function showPlaneInfo(p,distance){var call=p.flight?p.flight.replace(/\s/g,""):p.hex,vs=p.baro_rate||0,vsText=Math.abs(vs)<100?"LEVEL":(vs>0?"+"+vs:vs)+" ft/min",box=document.getElementById("planeInfo");box.innerHTML='<span class="close">×</span><div class="callsign">'+call+'</div>'+(p.r||"----")+" • "+(p.t||"----")+"<br><br>ALT&nbsp;&nbsp; "+(typeof p.alt_baro==="number"?p.alt_baro.toLocaleString()+" ft":"--")+"<br>GS&nbsp;&nbsp;&nbsp; "+(typeof p.gs==="number"?Math.round(p.gs)+" kt":"--")+"<br>HDG&nbsp;&nbsp; "+(typeof p.track==="number"?Math.round(p.track)+"°":"--")+"<br>V/S&nbsp;&nbsp; "+vsText+"<br>DIST&nbsp; "+Math.round(distance)+" km";box.style.display="block";box.onclick=function(){box.style.display="none"}}
function radarAnimation(){drawRadar();requestAnimationFrame(radarAnimation)}

function loadRainRadar(){if(!weatherMap||!weatherMap.loaded())return;fetch("https://api.rainviewer.com/public/weather-maps.json").then(r=>r.json()).then(function(data){var frames=data.radar&&data.radar.past?data.radar.past:[];if(!frames.length){document.getElementById("radarTime").innerHTML="RADAR --";return}var frame=frames[frames.length-1];if(weatherMap.getLayer("rainviewer-layer"))weatherMap.removeLayer("rainviewer-layer");if(weatherMap.getSource("rainviewer"))weatherMap.removeSource("rainviewer");weatherMap.addSource("rainviewer",{type:"raster",tiles:[data.host+frame.path+"/256/{z}/{x}/{y}/2/1_1.png"],tileSize:256,maxzoom:7});weatherMap.addLayer({id:"rainviewer-layer",type:"raster",source:"rainviewer",paint:{"raster-opacity":.72}});var d=new Date(frame.time*1000);document.getElementById("radarTime").innerHTML="RADAR "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}).catch(function(err){console.log("RainViewer:",err);document.getElementById("radarTime").innerHTML="RADAR OFF"})}
function weatherInfo(code){if(code===0)return["☀","Sereno"];if(code===1||code===2)return["◐","Poco nuvoloso"];if(code===3)return["☁","Nuvoloso"];if(code===45||code===48)return["≋","Nebbia"];if(code>=51&&code<=57)return["☂","Pioviggine"];if(code>=61&&code<=67)return["☂","Pioggia"];if(code>=71&&code<=77)return["❄","Neve"];if(code>=80&&code<=82)return["☂","Rovesci"];if(code>=95)return["ϟ","Temporale"];return["·","Variabile"]}
function loadWeather(){var url="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=2&timezone=Europe%2FRome";fetch(url).then(r=>r.json()).then(function(data){var c=data.current,wi=weatherInfo(c.weather_code);document.getElementById("weatherIcon").innerHTML=wi[0];document.getElementById("temperature").innerHTML=Math.round(c.temperature_2m)+"°";document.getElementById("weatherDescription").innerHTML=wi[1];document.getElementById("feels").innerHTML=Math.round(c.apparent_temperature)+"°";document.getElementById("humidity").innerHTML=c.relative_humidity_2m+"%";document.getElementById("wind").innerHTML=Math.round(c.wind_speed_10m)+" km/h";document.getElementById("rainNow").innerHTML=c.precipitation+" mm";var hourly=data.hourly,now=new Date(),start=0;for(var i=0;i<hourly.time.length;i++){if(new Date(hourly.time[i])>=now){start=i;break}}var html="";for(var n=0;n<6;n++){var idx=start+n*3;if(idx>=hourly.time.length)break;var time=new Date(hourly.time[idx]),icon=weatherInfo(hourly.weather_code[idx])[0];html+='<div class="forecast-row"><div class="fc-time">'+("0"+time.getHours()).slice(-2)+':00</div><div>'+icon+'</div><div class="fc-temp">'+Math.round(hourly.temperature_2m[idx])+'°</div><div class="fc-rain">'+hourly.precipitation_probability[idx]+'% ☂</div></div>'}document.getElementById("forecast").innerHTML=html}).catch(err=>console.log("Weather:",err))}

var sky=document.getElementById("skyCanvas"),sctx=sky.getContext("2d");
var stars=[["Sirius",6.752,-16.716,-1.46],["Canopus",6.399,-52.695,-.74],["Arcturus",14.261,19.182,-.05],["Vega",18.615,38.784,.03],["Capella",5.278,45.998,.08],["Rigel",5.243,-8.202,.13],["Procyon",7.655,5.225,.34],["Betelgeuse",5.919,7.407,.42],["Altair",19.846,8.868,.77],["Aldebaran",4.599,16.509,.85],["Spica",13.420,-11.161,.98],["Antares",16.490,-26.432,1.06],["Pollux",7.755,28.026,1.14],["Fomalhaut",22.961,-29.622,1.16],["Deneb",20.691,45.280,1.25],["Regulus",10.139,11.967,1.35],["Castor",7.576,31.888,1.58],["Bellatrix",5.419,6.350,1.64],["Alnilam",5.603,-1.201,1.69],["Alnitak",5.679,-1.943,1.74],["Dubhe",11.062,61.751,1.79],["Mirfak",3.405,49.861,1.79],["Alkaid",13.792,49.313,1.86],["Polaris",2.530,89.264,1.98],["Saiph",5.796,-9.670,2.09],["Denebola",11.818,14.572,2.14],["Algol",3.136,40.956,2.12],["Mizar",13.398,54.925,2.23],["Merak",11.031,56.382,2.37]];
function julianDate(date){return date.getTime()/86400000+2440587.5}function localSiderealTime(date){var d=julianDate(date)-2451545,gst=18.697374558+24.06570982441908*d,lst=gst+LON/15;return((lst%24)+24)%24}
function starAltAz(ra,dec,date){var H=(localSiderealTime(date)-ra)*15*Math.PI/180,decR=dec*Math.PI/180,latR=LAT*Math.PI/180,sinAlt=Math.sin(decR)*Math.sin(latR)+Math.cos(decR)*Math.cos(latR)*Math.cos(H),alt=Math.asin(sinAlt),y=-Math.sin(H)*Math.cos(decR),x=Math.sin(decR)*Math.cos(latR)-Math.cos(decR)*Math.sin(latR)*Math.cos(H),az=Math.atan2(y,x);if(az<0)az+=Math.PI*2;return{alt:alt*180/Math.PI,az:az*180/Math.PI}}
function drawSky(){sky.width=sky.clientWidth*window.devicePixelRatio;sky.height=sky.clientHeight*window.devicePixelRatio;sctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0);var w=sky.clientWidth,h=sky.clientHeight;sctx.clearRect(0,0,w,h);var cx=w/2,cy=h/2+5,radius=Math.min(w*.38,h*.43);sctx.strokeStyle="rgba(114,255,145,.30)";sctx.lineWidth=1;sctx.beginPath();sctx.arc(cx,cy,radius,0,Math.PI*2);sctx.stroke();sctx.strokeStyle="rgba(114,255,145,.10)";[.66,.33].forEach(v=>{sctx.beginPath();sctx.arc(cx,cy,radius*v,0,Math.PI*2);sctx.stroke()});sctx.fillStyle="#4aaa64";sctx.font="11px Courier New";sctx.textAlign="center";sctx.fillText("N",cx,cy-radius-7);sctx.fillText("S",cx,cy+radius+14);sctx.fillText("E",cx+radius+10,cy+4);sctx.fillText("W",cx-radius-10,cy+4);var now=new Date();for(var i=0;i<stars.length;i++){var star=stars[i],pos=starAltAz(star[1],star[2],now);if(pos.alt<=0)continue;var r=radius*(90-pos.alt)/90,a=(pos.az-90)*Math.PI/180,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,size=Math.max(1,3.1-star[3]);sctx.fillStyle="#d6ffdf";sctx.beginPath();sctx.arc(x,y,size,0,Math.PI*2);sctx.fill();if(star[3]<1.1){sctx.fillStyle="#71c987";sctx.font="9px Courier New";sctx.textAlign="left";sctx.fillText(star[0],x+5,y-3)}}sctx.fillStyle="#28673b";sctx.beginPath();sctx.arc(cx,cy,2,0,Math.PI*2);sctx.fill();document.getElementById("skyDate").innerHTML=("0"+now.getDate()).slice(-2)+"/"+("0"+(now.getMonth()+1)).slice(-2)+" • "+("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2)}

resizeRadar();loadAircraft();loadWeather();drawSky();radarAnimation();
setInterval(function(){sweepStart=Date.now();loadAircraft()},SWEEP_TIME);
setInterval(loadWeather,600000);setInterval(loadRainRadar,600000);setInterval(drawSky,60000);
window.addEventListener("resize",function(){resizeRadar();if(radarMap)radarMap.resize();if(weatherMap)weatherMap.resize();drawSky()});
</script>
