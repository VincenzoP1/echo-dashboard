<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  color: #72ff91;

/* ====================================
   HEADER
==================================== */

  left: 0;
  right: 0;
  top: 0;

==================================== */

  display: none;

  left: 0;
  right: 0;

  top: 46px;
  bottom: 55px;

  overflow: hidden;

==================================== */

<script>

/* =====================================
   CONFIG
===================================== */

var LAT = 38.27;
var LON = 16.30;

var MAX_RANGE = 200;

var ADSB_URL =
  "https://echo-show.akagigino.workers.dev/";

var SWEEP_TIME =
  10000;


/* =====================================
   CLOCK
===================================== */

function updateClock() {

  var d =
    new Date();

  document
    .getElementById("clock")
    .innerHTML =

    ("0" + d.getHours())
      .slice(-2)

    +

    ":"

    +

    ("0" + d.getMinutes())
      .slice(-2);

}

updateClock();

setInterval(
  updateClock,
  10000
);


/* =====================================
   NAVIGATION
===================================== */

var buttons =
  document
    .getElementsByClassName(
      "navbtn"
    );

for (
  var b = 0;
  b < buttons.length;
  b++
) {

  buttons[b].onclick =
    function() {

      var screens =
        document
          .getElementsByClassName(
            "screen"
          );

      for (
        var i = 0;
        i < screens.length;
        i++
      ) {

        screens[i].className =
          "screen";

      }

      for (
        var j = 0;
        j < buttons.length;
        j++
      ) {

        buttons[j].className =
          "navbtn";

      }

      var name =
        this.getAttribute(
          "data-screen"
        );

      document
        .getElementById(name)
        .className =
        "screen active";

      this.className =
        "navbtn active";

      if (
        name ===
        "radarScreen"
      ) {

        setTimeout(
          function() {

            if (radarMap) {
              radarMap.resize();
            }

            resizeRadar();

          },
          100
        );

      }

      if (
        name ===
        "weatherScreen"
      ) {

        setTimeout(
          function() {

            if (weatherMap) {
              weatherMap.resize();
            }

          },
          100
        );

      }

      if (
        name ===
        "skyScreen"
      ) {

        drawSky();

      }

    };

}


/* =====================================
   FULLSCREEN
===================================== */

document.body
.addEventListener(
  "dblclick",
  function() {

    var el =
      document.documentElement;

    if (
      el.requestFullscreen
    ) {

      el.requestFullscreen();

    }

    else if (
      el.webkitRequestFullscreen
    ) {

      el.webkitRequestFullscreen();

    }

  }
);


/* =====================================
   WAKE LOCK
===================================== */

var wakeLock = null;

async function requestWakeLock() {

  if (
    !("wakeLock" in navigator)
  ) {

    console.log(
      "Wake Lock non supportato"
    );

    return;

  }

  try {

    wakeLock =
      await navigator
        .wakeLock
        .request(
          "screen"
        );

    console.log(
      "Wake Lock attivo"
    );

  }

  catch (err) {

    console.log(
      "Wake Lock:",
      err
    );

  }

}


/* =====================================
   KEEP SILK OPEN - AUDIO
===================================== */

/*
  Echo Show / Silk può tornare alla Home
  anche con Screen Wake Lock.

  Questo crea una sessione Web Audio
  continua a volume praticamente nullo.

  Deve essere avviata dopo almeno
  un'interazione dell'utente.
*/

var keepAliveAudioContext = null;

var keepAliveOscillator = null;

var keepAliveGain = null;


function startSilkKeepAlive() {

  /*
    Se esiste già, ci limitiamo
    eventualmente a riprenderla.
  */

  if (keepAliveAudioContext) {

    if (
      keepAliveAudioContext.state ===
      "suspended"
    ) {

      keepAliveAudioContext
        .resume()
        .catch(
          function() {}
        );

    }

    return;

  }


  try {

    var AC =

      window.AudioContext

      ||

      window.webkitAudioContext;


    if (!AC) {

      console.log(
        "Web Audio non supportato"
      );

      return;

    }


    keepAliveAudioContext =
      new AC();


    keepAliveOscillator =
      keepAliveAudioContext
        .createOscillator();


    keepAliveGain =
      keepAliveAudioContext
        .createGain();


    /*
      Segnale molto basso.

      Il volume non è esattamente zero
      perché alcuni browser possono
      ottimizzare/eliminare una sorgente
      completamente muta.
    */

    keepAliveOscillator
      .frequency
      .value =
      20;


    keepAliveGain
      .gain
      .value =
      0.00001;


    keepAliveOscillator
      .connect(
        keepAliveGain
      );


    keepAliveGain
      .connect(
        keepAliveAudioContext
          .destination
      );


    keepAliveOscillator
      .start();


    if (
      keepAliveAudioContext.state ===
      "suspended"
    ) {

      keepAliveAudioContext
        .resume()
        .catch(
          function() {}
        );

    }


    console.log(
      "Silk keep-alive audio attivo"
    );

  }

  catch (err) {

    console.log(
      "Silk audio keep-alive:",
      err
    );

  }

}


/*
  Quando la pagina torna visibile,
  ripristiniamo Wake Lock e audio.
*/

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      requestWakeLock();

      if (
        keepAliveAudioContext &&
        keepAliveAudioContext.state ===
        "suspended"
      ) {

        keepAliveAudioContext
          .resume()
          .catch(
            function() {}
          );

      }

    }

  }
);


/*
  Al primo tap/click:

  1. Wake Lock
  2. Audio keep-alive

  Poi rimuoviamo i listener.
*/

function firstWakeInteraction() {

  requestWakeLock();

  startSilkKeepAlive();


  document.removeEventListener(
    "click",
    firstWakeInteraction
  );


  document.removeEventListener(
    "touchstart",
    firstWakeInteraction
  );

}


document.addEventListener(
  "click",
  firstWakeInteraction
);


document.addEventListener(
  "touchstart",
  firstWakeInteraction
);


/*
  Attività JS secondaria ogni 30 secondi.
*/

setInterval(
  function() {

    document
      .documentElement
      .setAttribute(
        "data-alive",
        Date.now()
      );

  },
  30000
);


/* =====================================
   MAPS
===================================== */

var radarMap = null;
var weatherMap = null;


/* =====================================
   MAP STYLE
===================================== */

function stripMapStyle(
  style,
  radarMode
) {

  if (!style.layers) {
    return style;
  }

  for (
    var i = 0;
    i < style.layers.length;
    i++
  ) {

    var layer =
      style.layers[i];

    var id =
      (layer.id || "")
        .toLowerCase();

    if (
      layer.layout &&
      layer.layout["text-field"]
    ) {

      layer.layout.visibility =
        "none";

    }

    if (
      id.indexOf("road") >= 0 ||
      id.indexOf("street") >= 0 ||
      id.indexOf("motorway") >= 0 ||
      id.indexOf("highway") >= 0 ||
      id.indexOf("poi") >= 0 ||
      id.indexOf("transit") >= 0 ||
      id.indexOf("rail") >= 0 ||
      id.indexOf("airport") >= 0 ||
      id.indexOf("aeroway") >= 0 ||
      id.indexOf("building") >= 0 ||
      id.indexOf("label") >= 0 ||
      id.indexOf("place") >= 0
    ) {

      if (!layer.layout) {
        layer.layout = {};
      }

      layer.layout.visibility =
        "none";

    }

    if (
      radarMode &&
      layer.paint
    ) {

      if (
        layer.type ===
        "background"
      ) {

        layer.paint[
          "background-color"
        ] =
          "#020705";

      }

      if (
        layer.type ===
        "fill"
      ) {

        layer.paint[
          "fill-color"
        ] =
          "#0b1c10";

        layer.paint[
          "fill-opacity"
        ] =
          0.72;

      }

      if (
        layer.type ===
        "line"
      ) {

        layer.paint[
          "line-color"
        ] =
          "#1d5530";

        layer.paint[
          "line-opacity"
        ] =
          0.42;

        layer.paint[
          "line-width"
        ] =
          1;

      }

    }

  }

  return style;

}


/* =====================================
   LOAD OPENFREEMAP
===================================== */

fetch(
  "https://tiles.openfreemap.org/styles/dark"
)

.then(
  function(r) {

    return r.json();

  }
)

.then(
  function(style) {

    var radarStyle =
      JSON.parse(
        JSON.stringify(style)
      );

    radarStyle =
      stripMapStyle(
        radarStyle,
        true
      );

    radarMap =
      new maplibregl.Map({

        container:
          "radarMap",

        style:
          radarStyle,

        center:
          [LON, LAT],

        zoom:
          6.3,

        bearing:

          0,

        interactive:
          false,

        attributionControl:
          false

      });

    radarMap.on(
      "load",
      function() {

        resizeRadar();

      }
    );


    var weatherStyle =
      JSON.parse(
        JSON.stringify(style)
      );

    weatherStyle =
      stripMapStyle(
        weatherStyle,
        false
      );

    weatherMap =
      new maplibregl.Map({

        container:
          "weatherMap",

        style:
          weatherStyle,

        center:
          [LON, LAT],

        zoom:
          6.4,

        bearing:
          0,

        pitch:
          0,

        interactive:
          false,

        attributionControl:
          false

      });

    weatherMap.on(
      "load",
      function() {

        loadRainRadar();

      }
    );

  }
)

.catch(
  function(err) {

    console.log(
      "Map error:",
      err
    );

  }
);


/* =====================================
   GEOGRAPHY
===================================== */

function haversine(
  lat1,
  lon1,
  lat2,
  lon2
) {

  var R =
    6371;

  var dLat =
    (lat2-lat1)
    *
    Math.PI/180;

  var dLon =
    (lon2-lon1)
    *
    Math.PI/180;

  var a =

    Math.sin(dLat/2)
    *
    Math.sin(dLat/2)

    +

    Math.cos(
      lat1 *
      Math.PI/180
    )

    *

    Math.cos(
      lat2 *
      Math.PI/180
    )

    *

    Math.sin(dLon/2)
    *
    Math.sin(dLon/2);

  return R * 2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1-a)

    );

}


/* =====================================
   RADAR
===================================== */

var radar =
  document
    .getElementById(
      "radarCanvas"
    );

var rctx =
  radar
    .getContext(
      "2d"
    );

var aircraft = [];

var planeHitAreas = [];

var trails = {};

var sweepStart =
  Date.now();


function resizeRadar() {

  radar.width =
    radar.clientWidth
    *
    window.devicePixelRatio;

  radar.height =
    radar.clientHeight
    *
    window.devicePixelRatio;

  rctx.setTransform(

    window.devicePixelRatio,

    0,

    0,

    window.devicePixelRatio,

    0,

    0

  );

}


/* =====================================
   AIRCRAFT SYMBOL
===================================== */

function drawPlane(
  ctx,
  x,
  y,
  heading
) {

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    heading *
    Math.PI/180
  );

  ctx.beginPath();

  ctx.moveTo(
    0,
    -8
  );

  ctx.lineTo(
    3,
    -2
  );

  ctx.lineTo(
    10,
    1
  );

  ctx.lineTo(
    10,
    3
  );

  ctx.lineTo(
    3,
    2
  );

  ctx.lineTo(
    2,
    7
  );

  ctx.lineTo(
    5,
    9
  );

  ctx.lineTo(
    5,
    10
  );

  ctx.lineTo(
    0,
    8
  );

  ctx.lineTo(
    -5,
    10
  );

  ctx.lineTo(
    -5,
    9
  );

  ctx.lineTo(
    -2,
    7
  );

  ctx.lineTo(
    -3,
    2
  );

  ctx.lineTo(
    -10,
    3
  );

  ctx.lineTo(
    -10,
    1
  );

  ctx.lineTo(
    -3,
    -2
  );

  ctx.closePath();

  ctx.strokeStyle =
    "#72ff91";

  ctx.lineWidth =
    1;

  ctx.stroke();

  ctx.restore();

}


/* =====================================
   RADAR GEOMETRY
===================================== */

function getRadarGeometry() {

  var w =
    radar.clientWidth;

  var h =
    radar.clientHeight;

  var cx =
    w/2;

  var cy =
    h/2;

  var radius =
    Math.min(
      w*.39,
      h*.43
    );

  if (
    radarMap &&
    radarMap.loaded()
  ) {

    var centerPoint =
      radarMap.project([
        LON,
        LAT
      ]);

    cx =
      centerPoint.x;

    cy =
      centerPoint.y;

    var deltaLat =
      MAX_RANGE /
      111.32;

    var northPoint =
      radarMap.project([

        LON,

        LAT +
        deltaLat

      ]);

    radius =
      Math.abs(
        centerPoint.y -
        northPoint.y
      );

  }

  return {

    w: w,

    h: h,

    cx: cx,

    cy: cy,

    radius: radius

  };

}


/* =====================================
   DRAW RADAR
===================================== */

function drawRadar() {

  var g =
    getRadarGeometry();

  var w =
    g.w;

  var h =
    g.h;

  var cx =
    g.cx;

  var cy =
    g.cy;

  var radius =
    g.radius;

  rctx.clearRect(
    0,
    0,
    w,
    h
  );


  /* RINGS */

  rctx.strokeStyle =
    "rgba(114,255,145,.24)";

  rctx.lineWidth =
    1;

  for (
    var ring=1;
    ring<=4;
    ring++
  ) {

    rctx.beginPath();

    rctx.arc(

      cx,

      cy,

      radius *
      ring/4,

      0,

      Math.PI*2

    );

    rctx.stroke();

  }


  /* CROSS */

  rctx.beginPath();

  rctx.moveTo(
    cx-radius,
    cy
  );

  rctx.lineTo(
    cx+radius,
    cy
  );

  rctx.moveTo(
    cx,
    cy-radius
  );

  rctx.lineTo(
    cx,
    cy+radius
  );

  rctx.stroke();


  /* COMPASS */

  rctx.fillStyle =
    "#4aaa64";

  rctx.font =
    "10px Courier New";

  rctx.textAlign =
    "center";

  rctx.fillText(
    "N",
    cx,
    cy-radius-7
  );

  rctx.fillText(
    "S",
    cx,
    cy+radius+14
  );

  rctx.fillText(
    "W",
    cx-radius-10,
    cy+3
  );

  rctx.fillText(
    "E",
    cx+radius+10,
    cy+3
  );


  /* RANGE LABELS */

  rctx.textAlign =
    "left";

  rctx.fillText(
    "50",
    cx+radius*.25+3,
    cy-3
  );

  rctx.fillText(
    "100",
    cx+radius*.50+3,
    cy-3
  );

  rctx.fillText(
    "150",
    cx+radius*.75+3,
    cy-3
  );

  rctx.fillText(
    "200 KM",
    cx+radius+3,
    cy-3
  );


  /* CENTER */

  rctx.fillStyle =
    "#72ff91";

  rctx.fillRect(
    cx-2,
    cy-2,
    4,
    4
  );


  planeHitAreas = [];


  /* AIRCRAFT */

  for (
    var i=0;
    i<aircraft.length;
    i++
  ) {

    var p =
      aircraft[i];

    if (
      typeof p.lat !==
      "number"
      ||
      typeof p.lon !==
      "number"
    ) {

      continue;

    }

    var dist =
      haversine(

        LAT,
        LON,

        p.lat,
        p.lon

      );

    if (
      dist >
      MAX_RANGE
    ) {

      continue;

    }

    var x;
    var y;

    if (
      radarMap &&
      radarMap.loaded()
    ) {

      var projected =
        radarMap.project([
          p.lon,
          p.lat
        ]);

      x =
        projected.x;

      y =
        projected.y;

    }

    else {

      var dx =
        (p.lon-LON)
        *
        Math.cos(
          LAT *
          Math.PI/180
        )
        *
        111.32;

      var dy =
        (p.lat-LAT)
        *
        111.32;

      x =
        cx +
        dx/MAX_RANGE
        *
        radius;

      y =
        cy -
        dy/MAX_RANGE
        *
        radius;

    }

    var id =
      p.hex ||
      ("p"+i);


    /* TRAIL */

    if (
      trails[id] &&
      trails[id].length > 1
    ) {

      rctx.strokeStyle =
        "rgba(74,190,99,.34)";

      rctx.lineWidth =
        1;

      rctx.beginPath();

      var started =
        false;

      for (
        var t=0;
        t<trails[id].length;
        t++
      ) {

        var pt =
          trails[id][t];

        var tx;
        var ty;

        if (
          radarMap &&
          radarMap.loaded()
        ) {

          var tp =
            radarMap.project([

              pt.lon,

              pt.lat

            ]);

          tx =
            tp.x;

          ty =
            tp.y;

        }

        else {

          var tdx =
            (pt.lon-LON)
            *
            Math.cos(
              LAT *
              Math.PI/180
            )
            *
            111.32;

          var tdy =
            (pt.lat-LAT)
            *
            111.32;

          tx =
            cx +
            tdx/MAX_RANGE
            *
            radius;

          ty =
            cy -
            tdy/MAX_RANGE
            *
            radius;

        }

        if (!started) {

          rctx.moveTo(
            tx,
            ty
          );

          started =
            true;

        }

        else {

          rctx.lineTo(
            tx,
            ty
          );

        }

      }

      rctx.stroke();

    }


    /* PLANE */

    drawPlane(

      rctx,

      x,

      y,

      p.track || 0

    );

    var call =

      p.flight

      ?

      p.flight.replace(
        /\s/g,
        ""
      )

      :

      (p.hex || "----")
        .toUpperCase();

    rctx.font =
      "10px Courier New";

    rctx.textAlign =
      "left";

    rctx.fillStyle =
      "#aaffb9";

    rctx.fillText(

      call,

      x+10,

      y-3

    );

    if (
      typeof p.alt_baro ===
      "number"
    ) {

      rctx.fillStyle =
        "#4aaa64";

      rctx.fillText(

        "FL" +

        Math.round(
          p.alt_baro/100
        ),

        x+10,

        y+8

      );

    }

    planeHitAreas.push({

      x: x,

      y: y,

      plane: p,

      distance: dist

    });

  }


  /* SWEEP */

  var elapsed =

    (Date.now()-sweepStart)

    %

    SWEEP_TIME;

  var progress =

    elapsed /

    SWEEP_TIME;

  var sweep =

    progress *
    Math.PI *
    2

    -

    Math.PI/2;

  var tailAngle =
    0.28;

  var sweepGradient =
    rctx.createRadialGradient(

      cx,
      cy,
      0,

      cx,
      cy,
      radius

    );

  sweepGradient
    .addColorStop(

      0,

      "rgba(114,255,145,.02)"

    );

  sweepGradient
    .addColorStop(

      1,

      "rgba(114,255,145,.13)"

    );

  rctx.beginPath();

  rctx.moveTo(
    cx,
    cy
  );

  rctx.arc(

    cx,
    cy,

    radius,

    sweep-tailAngle,

    sweep

  );

  rctx.closePath();

  rctx.fillStyle =
    sweepGradient;

  rctx.fill();


  var sx =

    cx +
    Math.cos(sweep)
    *
    radius;

  var sy =

    cy +
    Math.sin(sweep)
    *
    radius;

  var gradient =
    rctx.createLinearGradient(

      cx,
      cy,

      sx,
      sy

    );

  gradient.addColorStop(

    0,

    "rgba(114,255,145,.12)"

  );

  gradient.addColorStop(

    .6,

    "rgba(114,255,145,.55)"

  );

  gradient.addColorStop(

    1,

    "rgba(200,255,210,1)"

  );

  rctx.beginPath();

  rctx.moveTo(
    cx,
    cy
  );

  rctx.lineTo(
    sx,
    sy
  );

  rctx.strokeStyle =
    gradient;

  rctx.lineWidth =
    2;

  rctx.shadowColor =
    "#72ff91";

  rctx.shadowBlur =
    7;

  rctx.stroke();

  rctx.shadowBlur =
    0;

}


/* =====================================
   UPDATE TRAILS
===================================== */

function updateTrails() {

  for (
    var i=0;
    i<aircraft.length;
    i++
  ) {

    var p =
      aircraft[i];

    if (
      typeof p.lat !==
      "number"
      ||
      typeof p.lon !==
      "number"
    ) {

      continue;

    }

    var dist =
      haversine(

        LAT,
        LON,

        p.lat,
        p.lon

      );

    if (
      dist >
      MAX_RANGE
    ) {

      continue;

    }

    var id =
      p.hex ||
      ("p"+i);

    if (!trails[id]) {

      trails[id] = [];

    }

    var list =
      trails[id];

    var last =

      list.length

      ?

      list[
        list.length-1
      ]

      :

      null;

    if (
      !last
      ||
      Math.abs(
        last.lat-p.lat
      ) > 0.00005
      ||
      Math.abs(
        last.lon-p.lon
      ) > 0.00005
    ) {

      list.push({

        lat:
          p.lat,

        lon:
          p.lon,

        time:
          Date.now()

      });

    }

    if (
      list.length >
      18
    ) {

      list.splice(
        0,
        list.length-18
      );

    }

  }

  var now =
    Date.now();

  for (
    var key in trails
  ) {

    if (
      !trails.hasOwnProperty(key)
    ) {

      continue;

    }

    var arr =
      trails[key];

    if (!arr.length) {

      delete trails[key];

      continue;

    }

    var newest =
      arr[
        arr.length-1
      ];

    if (
      now-newest.time >
      300000
    ) {

      delete trails[key];

    }

  }

}

/* =====================================
   PLANE CLICK
===================================== */

radar
.addEventListener(
  "click",
  function(e) {

    var rect =
      radar
        .getBoundingClientRect();

    var x =
      e.clientX -
      rect.left;

    var y =
      e.clientY -
      rect.top;

    var closest =
      null;

    var best =
      24;

    for (
      var i=0;
      i<planeHitAreas.length;
      i++
    ) {

      var h =
        planeHitAreas[i];

      var d =
        Math.sqrt(

          Math.pow(
            x-h.x,
            2
          )

          +

          Math.pow(
            y-h.y,
            2
          )

        );

      if (
        d < best
      ) {

        best =
          d;

        closest =
          h;

      }

    }

    if (closest) {

      showPlaneInfo(

        closest.plane,

        closest.distance

      );

    }

  }
);

  )

            "radarTime"

          .innerHTML =

        frames[
          frames.length-1
        ];

        weatherMap.getLayer(
          "rainviewer-layer"
        )
      ) {

        weatherMap.removeLayer(
          "rainviewer-layer"
        );

      if (
        weatherMap.getSource(
          "rainviewer"
        )
      ) {

        weatherMap.removeSource(
          "rainviewer"
        );

      }

      weatherMap.addSource(

        "rainviewer",

        {

          type:
            "raster",

          tiles: [

            data.host +

            frame.path +

            "/256/{z}/{x}/{y}/2/1_1.png"

          ],

          tileSize:
            256,

          maxzoom:
            7

        }

      );

        id:
          "rainviewer-layer",

        type:
          "raster",

        source:
          "rainviewer",

        paint: {

          "raster-opacity":
            .72

      });

        new Date(
          frame.time *

        );

      document
        .getElementById(
          "radarTime"
        )
        .innerHTML =

          .slice(-2)

          .slice(-2);

  .catch(

        "RainViewer:",
        err
      );

      document
        .getElementById(
          "radarTime"
        )
        .innerHTML =
        "RADAR OFF";

    }
  );

}

   WEATHER
===================================== */

function weatherInfo(
  code
) {

  if (code===0)
    return ["☀","Sereno"];

  if (
    code===1 ||
    code===2
  )
    return ["◐","Poco nuvoloso"];

  if (code===3)
    return ["☁","Nuvoloso"];

  if (
    code===45 ||
    code===48
  )
    return ["≋","Nebbia"];

  if (
    code>=51 &&
    code<=57
  )
    return ["☂","Pioviggine"];

  if (
    code>=61 &&
    code<=67
  )
    return ["☂","Pioggia"];

  if (
    code>=71 &&
    code<=77
  )
    return ["❄","Neve"];

  if (
    code>=80 &&
    code<=82
  )
    return ["☂","Rovesci"];

  if (
    code>=95
  )
    return ["ϟ","Temporale"];

  return ["·","Variabile"];

}

function julianDate(
  date
) {

  return (
    date.getTime() /
    86400000
  )
  +
  2440587.5;

function localSiderealTime(
  date
) {

  var jd =
    julianDate(date);

  var d =
    jd -
    2451545.0;

  var gst =

    18.697374558

    +

    24.06570982441908

  var lst =

    gst

  return (

  24;

}

) {

  var lst =
    localSiderealTime(
      date
    );

  var H =

    (lst-ra)
    *
    15
    *
    Math.PI/180;

  var decR =
    dec *
    Math.PI/180;

  var latR =
    LAT *
    Math.PI/180;

  var sinAlt =

    Math.sin(decR)
    *
    Math.sin(latR)

    +

    Math.cos(decR)
    *
    Math.cos(latR)
    *
    Math.cos(H);

  var alt =
    Math.asin(
      sinAlt
    );

  var y =

    -Math.sin(H)
    *
    Math.cos(decR);

  var x =

    Math.sin(decR)
    *
    Math.cos(latR)

    -

    Math.cos(decR)
    *
    Math.sin(latR)
    *
    Math.cos(H);

  var az =
    Math.atan2(
      y,
      x
    );

  if (
    az < 0
  ) {

    az +=
      Math.PI*2;

  }

  return {

    alt:
      alt *
      180 /
      Math.PI,

    az:
      az *
      180 /
      Math.PI

  };

}


/* =====================================
   DRAW SKY
===================================== */

function drawSky() {

  sky.width =
    sky.clientWidth
    *
    window.devicePixelRatio;

  sky.height =
    sky.clientHeight
    *
    window.devicePixelRatio;

  sctx.setTransform(

    window.devicePixelRatio,

    0,

    0,

    window.devicePixelRatio,

    0,

    0

  );

  var w =
    sky.clientWidth;

  var h =
    sky.clientHeight;

  sctx.clearRect(
    0,
    0,
    w,
    h
  );

  var cx =
    w/2;

  var cy =
    h/2 + 5;

  var radius =

    Math.min(

      w*.38,

      h*.43

    );

  sctx.strokeStyle =
    "rgba(114,255,145,.30)";

  sctx.lineWidth =
    1;

  sctx.beginPath();

  sctx.arc(

    cx,
    cy,
    radius,

    0,

    Math.PI*2

  );

  sctx.stroke();

  sctx.strokeStyle =
    "rgba(114,255,145,.10)";

  sctx.beginPath();

  sctx.arc(

    cx,
    cy,
    radius*.66,

    0,

    Math.PI*2

  );

  sctx.stroke();

  sctx.beginPath();

  sctx.arc(

    cx,
    cy,
    radius*.33,

    0,

    Math.PI*2

  );

  sctx.stroke();

  sctx.fillStyle =
    "#4aaa64";

  sctx.font =
    "11px Courier New";

  sctx.textAlign =
    "center";

  sctx.fillText(
    "N",
    cx,
    cy-radius-7
  );

  sctx.fillText(
    "S",
    cx,
    cy+radius+14
  );

  sctx.fillText(
    "E",
    cx+radius+10,
    cy+4
  );

  sctx.fillText(
    "W",
    cx-radius-10,
    cy+4
  );

  var now =
    new Date();

  for (
    var i=0;
    i<stars.length;
    i++
  ) {

    var star =
      stars[i];

    var pos =
      starAltAz(

        star[1],

        star[2],

        now

      );

    if (
      pos.alt <= 0
    ) {

      continue;

    }

    var r =

      radius *

      (
        90-pos.alt
      )

      /

      90;

    var a =

      (pos.az-90)
      *
      Math.PI/180;

    var x =
      cx +
      Math.cos(a)
      *
      r;

    var y =
      cy +
      Math.sin(a)
      *
      r;

    var size =

      Math.max(

        1,

        3.1-star[3]

      );

    sctx.fillStyle =
      "#d6ffdf";

    sctx.beginPath();

    sctx.arc(

      x,
      y,
      size,

      0,

      Math.PI*2

    );

    sctx.fill();

    if (
      star[3] < 1.1
    ) {

      sctx.fillStyle =
        "#71c987";

      sctx.font =
        "9px Courier New";

      sctx.textAlign =
        "left";

      sctx.fillText(

        star[0],

        x+5,

        y-3

      );

    }

  }

  sctx.fillStyle =
    "#28673b";

  sctx.beginPath();

  sctx.arc(

    cx,
    cy,
    2,

    0,

    Math.PI*2

  );

  sctx.fill();

  document
    .getElementById(
      "skyDate"
    )
    .innerHTML =

    ("0"+now.getDate())
      .slice(-2)

    +

    "/"

    +

    ("0"+(now.getMonth()+1))
      .slice(-2)

    +

    " • "

    +

    ("0"+now.getHours())
      .slice(-2)

    +

    ":"

    +

    ("0"+now.getMinutes())
      .slice(-2);

}


/* =====================================
   START
===================================== */

resizeRadar();

loadAircraft();

loadWeather();

drawSky();

/*
  Proviamo comunque Wake Lock subito.
  Se Silk richiede interazione,
  verrà riprovato al primo tap.
*/

requestWakeLock();

radarAnimation();


/*
  ADS-B a ogni sweep.
*/

setInterval(

  function() {

    sweepStart =
      Date.now();

    loadAircraft();

  },

  SWEEP_TIME

);


/*
  Meteo ogni 10 minuti.
*/

setInterval(
  loadWeather,
  600000
);


/*
  Radar pioggia ogni 10 minuti.
*/

setInterval(
  loadRainRadar,
  600000
);


/*
  Cielo ogni minuto.
*/

setInterval(
  drawSky,
  60000
);


/* =====================================
   RESIZE
===================================== */

window.addEventListener(
  "resize",
  function() {

    resizeRadar();

    if (radarMap) {

      radarMap.resize();

    }

    if (weatherMap) {

      weatherMap.resize();

    }

    drawSky();

  }
);

</script>
