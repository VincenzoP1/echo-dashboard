<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Echo Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Barra superiore */
    #topbar {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #10151d;
    }

    #clock {
      font-size: 27px;
      font-weight: bold;
    }

    #date {
      font-size: 16px;
      opacity: 0.7;
    }

    /* Area centrale */
    #content {
      height: calc(100vh - 120px);
      position: relative;
    }

    .page {
      display: none;
      width: 100%;
      height: 100%;
    }

    .page.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pagina aerei */
    #aircraft {
      background: #05080d;
    }

    #aircraft iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Pagine test */
    .placeholder {
      text-align: center;
      font-size: 30px;
    }

    .placeholder small {
      display: block;
      font-size: 17px;
      opacity: 0.6;
      margin-top: 10px;
    }

    /* Navigazione inferiore */
    #nav {
      height: 65px;
      display: flex;
      background: #10151d;
    }

    #nav button {
      flex: 1;
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 17px;
      cursor: pointer;
    }

    #nav button.active {
      color: white;
      background: #1b2430;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <div id="clock">--:--</div>
    <div id="date">---</div>
  </div>

  <div id="content">

    <div id="aircraft" class="page active">
      <iframe src="https://globe.adsb.fi/"></iframe>
    </div>

    <div id="radar" class="page">
      <div class="placeholder">
        🌧️ RADAR
        <small>Lo aggiungiamo dopo il test</small>
      </div>
    </div>

    <div id="weather" class="page">
      <div class="placeholder">
        ☀️ METEO
        <small>Lo aggiungiamo dopo il test</small>
      </div>
    </div>

  </div>

  <div id="nav">
    <button class="active"
            onclick="showPage('aircraft',this)">
      ✈️ AEREI
    </button>

    <button onclick="showPage('radar',this)">
      🌧️ RADAR
    </button>

    <button onclick="showPage('weather',this)">
      ☀️ METEO
    </button>
  </div>


<script>

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("it-IT", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("it-IT", {
      weekday: "short",
      day: "numeric",
      month: "short"
    }).toUpperCase();
}

updateClock();
setInterval(updateClock, 1000);


function showPage(id, button) {

  document.querySelectorAll(".page")
    .forEach(page => page.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll("#nav button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
}

</script>

</body>
</html>
